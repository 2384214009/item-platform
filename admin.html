<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>管理后台 - 物品展示选择平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f5f9f8;color:#333;min-height:100vh;}
:root{--primary:#2eb4a8;--primary-dark:#1a8a7f;--primary-light:#e8f5f3;--bg:#f5f9f8;--card:#fff;--text:#333;--text2:#888;--text3:#bbb;--border:#eef2f1;--danger:#f56c6c;--warning:#e6a23c;--success:#67c23a;--radius:16px;--radius-sm:10px;--radius-btn:24px;}
.app{max-width:500px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:20px;}
.login-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.login-icon{width:60px;height:60px;border-radius:16px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.login-icon svg{width:28px;height:28px;color:var(--primary);}
.login-title{font-size:22px;font-weight:700;color:var(--primary);margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px;}
.login-card{background:#fff;border-radius:var(--radius);padding:24px 20px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.form-group{margin-bottom:16px;}
.form-label{font-size:13px;color:var(--text);margin-bottom:6px;display:block;font-weight:500;}
.form-input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:border-color .2s;background:#fff;}
.form-input:focus{border-color:var(--primary);}
.form-input-icon{position:relative;}
.form-input-icon svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3);}
.form-input-icon input{padding-left:36px;}
.check-row{display:flex;align-items:center;gap:6px;margin-bottom:20px;}
.check-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);}
.check-row label{font-size:13px;color:var(--text2);cursor:pointer;}
.btn-primary{width:100%;padding:12px;border-radius:var(--radius-btn);background:var(--primary);color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;}
.btn-primary:active{opacity:.85;}
.btn-sm{padding:6px 14px;border-radius:16px;border:none;font-size:12px;font-weight:600;cursor:pointer;color:#fff;transition:opacity .2s;flex:1;}
.btn-sm:active{opacity:.85;}
.login-back{margin-top:20px;font-size:13px;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:4px;}
.login-back:hover{color:var(--primary);}
.admin-head{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.admin-home{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.admin-home svg{width:20px;height:20px;color:var(--text2);}
.admin-title{flex:1;text-align:center;}
.admin-title h2{font-size:17px;font-weight:700;color:var(--primary);}
.admin-user{font-size:12px;color:var(--text2);margin-top:2px;}
.admin-logout{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.admin-logout svg{width:18px;height:18px;color:var(--text2);}
.tabs{background:#fff;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:8px 16px;border-radius:20px;background:var(--bg);font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px;border:none;font-family:inherit;}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(46,180,168,.25);}
.tabs-row2{background:#fff;padding:0 16px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);}
.tabs-row2::-webkit-scrollbar{display:none;}
.admin-body{padding:16px;}
.panel{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.03);}
.panel-title{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:6px;}
.panel-title svg{width:18px;height:18px;color:var(--primary);}
.cat-form-row{display:flex;gap:10px;margin-bottom:12px;}
.cat-form-row .form-input{flex:1;}
.cat-list-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:8px;}
.cat-drag{color:var(--text3);cursor:grab;flex-shrink:0;}
.cat-name{flex:1;font-size:14px;font-weight:500;}
.cat-sort{font-size:12px;color:var(--text2);}
.cat-del{width:30px;height:30px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;border:1px solid var(--border);}
.cat-del svg{width:14px;height:14px;color:var(--danger);}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:30px 20px;text-align:center;cursor:pointer;transition:border-color .2s;background:var(--bg);}
.upload-area:hover{border-color:var(--primary);}
.upload-area svg{width:32px;height:32px;color:var(--text3);margin-bottom:8px;}
.upload-area p{font-size:13px;color:var(--text2);}
.upload-preview{width:100%;max-height:200px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:10px;display:none;}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
.switch-label{font-size:14px;color:var(--text);}
.switch-desc{font-size:12px;color:var(--text2);margin-top:2px;}
.switch{position:relative;width:44px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;transition:.3s;border-radius:24px;}
.switch-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%;}
.switch input:checked + .switch-slider{background:var(--primary);}
.switch input:checked + .switch-slider:before{transform:translateX(20px);}
.goods-search{margin-bottom:14px;position:relative;}
.goods-search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;background:#fff;}
.goods-search input:focus{border-color:var(--primary);}
.goods-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3);}
.goods-row{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:var(--radius-sm);margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.03);}
.goods-row-img{width:56px;height:56px;border-radius:10px;overflow:hidden;background:#f0f0f0;flex-shrink:0;position:relative;}
.goods-row-img img{width:100%;height:100%;object-fit:cover;display:block;}
.goods-row-img .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;text-align:center;padding:2px;position:absolute;top:0;left:0;}
.goods-row-info{flex:1;min-width:0;}
.goods-row-name{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.goods-row-code{font-size:12px;color:var(--primary);font-weight:600;margin-bottom:2px;}
.goods-row-cat{font-size:12px;color:var(--text2);}
.status-badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;flex-shrink:0;}
.status-badge.normal{background:#f0f9eb;color:var(--success);}
.status-badge.sellout{background:#fef0f0;color:var(--danger);}
.goods-row-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.action-btn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);background:#fff;}
.action-btn svg{width:14px;height:14px;}
.action-btn.edit svg{color:var(--text2);}
.action-btn.toggle svg{color:var(--primary);}
.action-btn.toggle.off svg{color:var(--warning);}
.action-btn.del{border-color:#fef0f0;}
.action-btn.del svg{color:var(--danger);}
.record-filters{display:flex;gap:8px;margin-bottom:14px;}
.record-filter{padding:7px 18px;border-radius:20px;background:#fff;border:1px solid var(--border);font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s;}
.record-filter.active{background:var(--primary);color:#fff;border-color:transparent;}
.record-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.03);}
.record-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.record-no{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.3px;}
.record-device{font-size:11px;color:var(--text3);margin-top:2px;}
.record-items{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;}
.record-item-title{font-size:12px;color:var(--text2);margin-bottom:6px;}
.record-item-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px;}
.record-item-name{color:var(--text);}
.record-item-code{color:var(--text2);font-size:12px;}
.record-total{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);margin-bottom:10px;}
.record-total-label{font-size:13px;color:var(--text2);}
.record-total-val{font-size:18px;font-weight:700;color:var(--primary);}
.record-contact{font-size:13px;color:var(--text);line-height:1.8;}
.record-contact div{display:flex;align-items:center;gap:6px;}
.record-contact .icon{width:14px;text-align:center;}
.record-time{font-size:12px;color:var(--text3);margin-top:6px;}
.record-action-btn{width:100%;padding:10px;border-radius:var(--radius-btn);background:var(--primary);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;}
.record-action-btn.done{background:var(--success);}
.record-action-btn.del{background:#fef0f0;color:var(--danger);margin-top:8px;}
.order-status{padding:4px 12px;border-radius:12px;font-size:11px;font-weight:600;flex-shrink:0;}
.order-status.pending{background:#fff7e6;color:var(--warning);}
.order-status.done{background:#f0f9eb;color:var(--success);}
.bulletin-item{padding:12px 0;border-bottom:1px solid var(--border);}
.bulletin-item:last-child{border-bottom:none;}
.bulletin-content{font-size:14px;color:var(--text);margin-bottom:8px;}
.bulletin-actions{display:flex;gap:8px;}
.bulletin-btn{padding:5px 12px;border-radius:14px;font-size:12px;cursor:pointer;border:none;font-family:inherit;}
.bulletin-btn.enable{background:var(--primary-light);color:var(--primary-dark);}
.bulletin-btn.disable{background:#fff3e0;color:var(--warning);}
.bulletin-btn.del{background:#fef0f0;color:var(--danger);}
.pwd-group{margin-bottom:14px;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;display:none;max-width:80%;text-align:center;}
.toast.show{display:block;}
.empty{text-align:center;padding:40px 20px;}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.5;}
.empty-text{font-size:14px;color:var(--text2);}
.grad-1{background:linear-gradient(135deg,#667eea,#764ba2)!important;}
.grad-2{background:linear-gradient(135deg,#f093fb,#f5576c)!important;}
.grad-3{background:linear-gradient(135deg,#4facfe,#00f2fe)!important;}
.grad-0{background:linear-gradient(135deg,#a8edea,#fed6e3)!important;}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="login-page" id="loginPage">
  <div class="login-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
  <div class="login-title">管理后台</div>
  <div class="login-sub">请使用管理员账号登录</div>
  <div class="login-card">
    <div class="form-group"><label class="form-label">账号</label><div class="form-input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" class="form-input" id="loginUser" placeholder="请输入账号"></div></div>
    <div class="form-group"><label class="form-label">密码</label><div class="form-input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" class="form-input" id="loginPwd" placeholder="请输入密码"></div></div>
    <div class="check-row"><input type="checkbox" id="rememberCheck"><label for="rememberCheck">在本设备保存账号密码</label></div>
    <button class="btn-primary" onclick="doLogin()">登录</button>
  </div>
  <div class="login-back" onclick="goFront()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>返回前台浏览</div>
</div>
<div class="app" id="adminApp" style="display:none;">
  <div class="admin-head">
    <div class="admin-home" onclick="goFront()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
    <div class="admin-title"><h2>管理后台</h2><div class="admin-user" id="adminUser"></div></div>
    <div class="admin-logout" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
  </div>
  <div class="tabs" id="tabsRow1">
    <button class="tab active" onclick="switchTab('cat')">分类管理</button>
    <button class="tab" onclick="switchTab('addGoods')">+ 新增物品</button>
    <button class="tab" onclick="switchTab('goodsList')">物品列表</button>
    <button class="tab" onclick="switchTab('records')">提交记录</button>
  </div>
  <div class="tabs-row2" id="tabsRow2">
    <button class="tab" onclick="switchTab('bulletin')">公告管理</button>
    <button class="tab" onclick="switchTab('account')">账号设置</button>
    <button class="tab super-only" onclick="switchTab('reports')">举报管理</button>
    <button class="tab super-only" onclick="switchTab('admins')">管理员管理</button>
  </div>
  <div class="admin-body">
    <div id="panel-cat">
      <div class="panel"><div class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>新增分类</div><div class="cat-form-row"><input type="text" class="form-input" id="newCatName" placeholder="分类名称"><input type="number" class="form-input" id="newCatSort" placeholder="排序" style="max-width:100px;"></div><button class="btn-primary" onclick="addCat()">+ 新增分类</button></div>
      <div class="panel"><div class="panel-title" id="catListTitle">分类列表</div><div id="catList"></div></div>
    </div>
    <div id="panel-addGoods" style="display:none;">
      <div class="panel"><div class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg><span id="addGoodsTitle">新增物品</span></div>
        <div class="form-group"><label class="form-label">物品名称 <span style="color:var(--danger);">*</span></label><input type="text" class="form-input" id="gName" placeholder="请输入物品名称"></div>
        <div class="form-group"><label class="form-label">编号 <span style="color:var(--danger);">*</span></label><input type="text" class="form-input" id="gCode" placeholder="请输入物品编号"></div>
        <div class="form-group"><label class="form-label">选择分类（可选）</label><select class="form-input" id="gCat"></select></div>
        <div class="form-group"><label class="form-label">简介描述</label><textarea class="form-input" id="gDesc" placeholder="请输入物品简介描述" style="min-height:80px;resize:vertical;font-family:inherit;"></textarea></div>
        <div class="form-group"><label class="form-label">封面图片</label><img class="upload-preview" id="gPreview"><div class="upload-area" id="gUploadArea" onclick="document.getElementById('gUpload').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><p>点击上传封面图片</p></div><input type="file" accept="image/*" id="gUpload" style="display:none;"></div>
        <div class="switch-row"><div><div class="switch-label">标记无库存</div><div class="switch-desc">开启后物品会显示"无库存"标签</div></div><label class="switch"><input type="checkbox" id="gSellout"><span class="switch-slider"></span></label></div>
        <button class="btn-primary" style="margin-top:16px;" onclick="saveGoods()" id="saveGoodsBtn">创建物品</button>
      </div>
    </div>
    <div id="panel-goodsList" style="display:none;"><div class="goods-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="goodsSearch" placeholder="搜索物品名称..." oninput="renderGoodsList()"></div><div id="goodsListBody"></div></div>
    <div id="panel-records" style="display:none;"><div class="record-filters"><div class="record-filter active" onclick="filterRecords('all',this)">全部</div><div class="record-filter" onclick="filterRecords('pending',this)">待处理</div><div class="record-filter" onclick="filterRecords('done',this)">已处理</div></div><div id="recordsBody"></div></div>
    <div id="panel-bulletin" style="display:none;"><div class="panel"><div class="panel-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>新增公告</div><div class="form-group"><textarea class="form-input" id="newBulletin" placeholder="请输入公告内容" style="min-height:80px;resize:vertical;font-family:inherit;"></textarea></div><div class="check-row"><input type="checkbox" id="newBulletinEnable" checked><label for="newBulletinEnable">立即启用</label></div><button class="btn-primary" onclick="addBulletin()">发布公告</button></div><div class="panel"><div class="panel-title">公告列表</div><div id="bulletinList"></div></div></div>

<script>
var curUser='',curRole='normal',editGoodsId=null,recordFilter='all',hasUploadedImage=false,imageCache={},idbLoaded=false,idbDb=null;
function initIDB(callback){try{var req=indexedDB.open('shop_images',1);req.onupgradeneeded=function(e){idbDb=e.target.result;if(!idbDb.objectStoreNames.contains('images')){idbDb.createObjectStore('images');}};req.onsuccess=function(e){idbDb=e.target.result;try{var tx=idbDb.transaction('images','readonly');var store=tx.objectStore('images');var keysReq=store.getAllKeys();keysReq.onsuccess=function(){var keys=keysReq.result;var loaded=0;if(keys.length===0){idbLoaded=true;if(callback)callback();return;}keys.forEach(function(key){var getReq=store.get(key);getReq.onsuccess=function(){imageCache[key]=getReq.result;loaded++;if(loaded>=keys.length){idbLoaded=true;if(callback)callback();}};});};}catch(e){idbLoaded=true;if(callback)callback();}};req.onerror=function(){idbLoaded=true;if(callback)callback();};}catch(e){idbLoaded=true;if(callback)callback();}}
function idbSave(key,val){imageCache[key]=val;if(idbDb){try{var tx=idbDb.transaction('images','readwrite');tx.objectStore('images').put(val,key);}catch(e){}}}
function idbDelete(key){delete imageCache[key];if(idbDb){try{var tx=idbDb.transaction('images','readwrite');tx.objectStore('images').delete(key);}catch(e){}}}
initIDB();
// ===== Supabase配置（跨设备同步举报数据）=====
var SUPABASE_URL='https://sfozgzaopzvxrsxbfyla.supabase.co';
var SUPABASE_ANON_KEY='sb_publishable_H9gYwPXXuKQVpH6Q8XCnRw_yZ1dyaPp';
var SUPABASE_ENABLED = SUPABASE_URL && SUPABASE_ANON_KEY;
function supabaseRequest(table, method, body, query){
  if(!SUPABASE_ENABLED) return Promise.reject(new Error('Supabase未配置'));
  var url=SUPABASE_URL+'/rest/v1/'+table;
  if(query) url+='?'+query;
  return new Promise(function(resolve,reject){
    var xhr=new XMLHttpRequest();
    xhr.open(method,url,true);
    xhr.setRequestHeader('apikey',SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Content-Type','application/json');
    xhr.setRequestHeader('Prefer','return=representation');
    xhr.onload=function(){
      if(xhr.status>=200&&xhr.status<300){
        try{resolve(JSON.parse(xhr.responseText));}catch(e){resolve(xhr.responseText);}
      }else{
        reject(new Error('Supabase请求失败:'+xhr.status+' '+xhr.responseText));
      }
    };
    xhr.onerror=function(){reject(new Error('Supabase网络错误'));};
    xhr.send(body?JSON.stringify(body):null);
  });
}
function fetchReportsFromSupabase(){ return supabaseRequest('reports','GET',null,'select=*&order=time.desc'); }
function fetchBannedFromSupabase(){ return supabaseRequest('banned_devices','GET',null,'select=*'); }
function insertReportToSupabase(report){ return supabaseRequest('reports','POST',report); }
function insertBannedToSupabase(device){ return supabaseRequest('banned_devices','POST',device); }
function deleteBannedFromSupabase(deviceId){ return supabaseRequest('banned_devices','DELETE',null,'device_id=eq.'+encodeURIComponent(deviceId)); }
function updateReportStatus(reportId,status){ return supabaseRequest('reports','PATCH',{status:status},'id=eq.'+encodeURIComponent(reportId)); }
function deleteReportFromSupabase(reportId){ return supabaseRequest('reports','DELETE',null,'id=eq.'+encodeURIComponent(reportId)); }
// ================================================
function getDb(){try{var raw=localStorage.getItem('shop_db');if(!raw)return{goods:[],categories:[],bulletins:[],cart:[],orders:[],adminAccounts:[{username:'2384214009',pwd:'13727733582q',role:'super'},{username:'admin',pwd:'admin123',role:'normal'}]};var db=JSON.parse(raw);db.goods.forEach(function(g){if(g.img&&g.img.indexOf('idb://')===0){var key=g.img.substring(6);g.img=imageCache[key]||'';}});return db;}catch(e){return{goods:[],categories:[],bulletins:[],cart:[],orders:[],adminAccounts:[]};}}
function saveDb(db){try{var dbCopy=JSON.parse(JSON.stringify(db));dbCopy.goods.forEach(function(g){if(g.img&&g.img.indexOf('data:image')===0){var key='img_'+g.id;idbSave(key,g.img);g.img='idb://'+key;}});localStorage.setItem('shop_db',JSON.stringify(dbCopy));}catch(e){if(e.name==='QuotaExceededError'||e.code===22){showToast('存储空间不足，请删除部分旧物品或订单后重试');}else{showToast('保存失败：'+e.message);}throw e;}}
function showToast(msg){var t=document.getElementById('toast');t.innerText=msg;t.className='toast show';setTimeout(function(){t.className='toast';},2000);}
function getGrad(catId){if(catId==='aixi')return'grad-1';if(catId==='alishan')return'grad-2';if(catId==='baile')return'grad-3';return'grad-0';}
function getCatName(catId){var db=getDb();var c=db.categories.find(function(x){return x.id===catId;});return c?c.name:'';}
function loadRemember(){var rem=localStorage.getItem('admin_remember');if(rem){try{var obj=JSON.parse(atob(rem));document.getElementById('loginUser').value=obj.u;document.getElementById('loginPwd').value=obj.p;document.getElementById('rememberCheck').checked=true;}catch(e){}}}
loadRemember();
function doLogin(){var u=document.getElementById('loginUser').value.trim().toLowerCase();var p=document.getElementById('loginPwd').value.trim();if(!u||!p){showToast('请输入账号和密码');return;}var db=getDb();var admin=db.adminAccounts.find(function(a){return a.username.toLowerCase()===u&&a.pwd===p;});if(!admin){showToast('账号或者密码错误，请检查');return;}curUser=admin.username;curRole=admin.role||'normal';if(document.getElementById('rememberCheck').checked){localStorage.setItem('admin_remember',btoa(JSON.stringify({u:u,p:p})));}else{localStorage.removeItem('admin_remember');}document.getElementById('loginPage').style.display='none';document.getElementById('adminApp').style.display='block';document.getElementById('adminUser').innerText=curUser;if(curRole==='super'){document.querySelectorAll('.super-only').forEach(function(el){el.style.display='';});}else{document.querySelectorAll('.super-only').forEach(function(el){el.style.display='none';});}switchTab('cat');if(idbLoaded){initAdmin();}else{showToast('加载数据中...');initIDB(initAdmin);}}
function doLogout(){localStorage.removeItem('admin_remember');location.reload();}
function goFront(){window.location.href='index.html';}
function initAdmin(){renderCatSelect();renderCatList();renderGoodsList();renderRecords();renderBulletins();renderAdminList();renderReports();renderBannedDevices();setupImageUpload();showStorageUsage();switchTab('cat');}
function switchTab(tab){var tabs1=document.querySelectorAll('#tabsRow1 .tab');var tabs2=document.querySelectorAll('#tabsRow2 .tab');var allTabs=Array.prototype.slice.call(tabs1).concat(Array.prototype.slice.call(tabs2));var tabMap={cat:0,addGoods:1,goodsList:2,records:3,bulletin:4,account:5,reports:6,admins:7};allTabs.forEach(function(t,i){t.classList.toggle('active',i===tabMap[tab]);});var panels=['cat','addGoods','goodsList','records','bulletin','account','reports','admins'];panels.forEach(function(p){document.getElementById('panel-'+p).style.display=(p===tab?'block':'none');});if(tab==='addGoods'){resetGoodsForm();}}
function renderCatSelect(){var db=getDb();var sel=document.getElementById('gCat');sel.innerHTML='<option value="">请选择分类</option>';db.categories.filter(function(c){return c.id!=='all';}).forEach(function(c){sel.innerHTML+='<option value="'+c.id+'">'+c.name+'</option>';});}
function renderCatList(){var db=getDb();var list=db.categories.filter(function(c){return c.id!=='all';});document.getElementById('catListTitle').innerText='分类列表（'+list.length+'）';var wrap=document.getElementById('catList');if(list.length===0){wrap.innerHTML='<div class="empty"><div class="empty-icon">📂</div><div class="empty-text">暂无分类</div></div>';return;}var html='';list.forEach(function(c){html+='<div class="cat-list-item"><span class="cat-drag">⋮⋮</span><span class="cat-name">'+c.name+'</span><span class="cat-sort">排序：'+(c.sort||0)+'</span><div class="cat-del" onclick="delCat(\''+c.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div></div>';});wrap.innerHTML=html;}
function addCat(){var name=document.getElementById('newCatName').value.trim();var sort=parseInt(document.getElementById('newCatSort').value)||0;if(!name){showToast('请输入分类名称');return;}var db=getDb();var id='cat_'+Date.now();db.categories.push({id:id,name:name,sort:sort});saveDb(db);document.getElementById('newCatName').value='';document.getElementById('newCatSort').value='';renderCatSelect();renderCatList();showToast('分类添加成功');}
function delCat(id){if(!confirm('确定删除该分类？'))return;var db=getDb();db.categories=db.categories.filter(function(c){return c.id!==id;});saveDb(db);renderCatSelect();renderCatList();showToast('已删除');}
function resetGoodsForm(){editGoodsId=null;hasUploadedImage=false;document.getElementById('addGoodsTitle').innerText='新增物品';document.getElementById('saveGoodsBtn').innerText='创建物品';document.getElementById('gName').value='';document.getElementById('gCode').value='';document.getElementById('gCat').value='';document.getElementById('gDesc').value='';document.getElementById('gSellout').checked=false;document.getElementById('gPreview').style.display='none';document.getElementById('gPreview').src='';document.getElementById('gUpload').value='';}
function setupImageUpload(){var upload=document.getElementById('gUpload');if(upload){upload.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var img=new Image();img.onload=function(){var maxW=500;var w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);var dataUrl=canvas.toDataURL('image/jpeg',0.6);var preview=document.getElementById('gPreview');preview.src=dataUrl;preview.style.display='block';hasUploadedImage=true;};img.src=ev.target.result;};r.readAsDataURL(f);};}}
function saveGoods(){var name=document.getElementById('gName').value.trim();var code=document.getElementById('gCode').value.trim();var catId=document.getElementById('gCat').value;var desc=document.getElementById('gDesc').value.trim();var img=document.getElementById('gPreview').src;var sellout=document.getElementById('gSellout').checked;if(!name){showToast('请输入物品名称');return;}if(!code){showToast('请输入物品编号');return;}if(!hasUploadedImage&&!editGoodsId){showToast('请上传封面图片');return;}if(editGoodsId&&!img){showToast('请上传封面图片');return;}var db=getDb();if(editGoodsId){var idx=db.goods.findIndex(function(g){return g.id===editGoodsId;});if(idx>=0){db.goods[idx]={id:editGoodsId,name:name,code:code,catId:catId,desc:desc,img:img,sellout:sellout};}showToast('修改成功');}else{db.goods.push({id:Date.now(),name:name,code:code,catId:catId,desc:desc,img:img,sellout:sellout});showToast('创建成功');}saveDb(db);resetGoodsForm();renderGoodsList();}
function editGoods(id){var db=getDb();var g=db.goods.find(function(x){return x.id==id;});if(!g)return;switchTab('addGoods');editGoodsId=id;hasUploadedImage=true;document.getElementById('addGoodsTitle').innerText='编辑物品';document.getElementById('saveGoodsBtn').innerText='保存修改';document.getElementById('gName').value=g.name;document.getElementById('gCode').value=g.code||'';document.getElementById('gCat').value=g.catId||'';document.getElementById('gDesc').value=g.desc||'';document.getElementById('gSellout').checked=!!g.sellout;if(g.img){document.getElementById('gPreview').src=g.img;document.getElementById('gPreview').style.display='block';}}
function toggleGoodsSellout(id){var db=getDb();var g=db.goods.find(function(x){return x.id==id;});if(!g)return;g.sellout=!g.sellout;saveDb(db);renderGoodsList();showToast(g.sellout?'已标记无库存':'已恢复上架');}
function delGoods(id){if(!confirm('确定删除该物品？'))return;var db=getDb();var goods=db.goods.find(function(x){return x.id==id;});if(goods&&goods.img&&goods.img.indexOf('idb://')===0){idbDelete(goods.img.substring(6));}db.goods=db.goods.filter(function(g){return g.id!=id;});saveDb(db);renderGoodsList();showToast('已删除');}
function renderGoodsList(){var db=getDb();var keyword=document.getElementById('goodsSearch')?document.getElementById('goodsSearch').value.trim().toLowerCase():'';var list=db.goods;if(keyword){list=list.filter(function(g){return g.name.toLowerCase().indexOf(keyword)!==-1;});}var wrap=document.getElementById('goodsListBody');if(list.length===0){wrap.innerHTML='<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">暂无物品</div></div>';return;}var html='';list.forEach(function(g){var grad=getGrad(g.catId);var statusBadge=g.sellout?'<span class="status-badge sellout">无库存</span>':'<span class="status-badge normal">正常</span>';var toggleClass=g.sellout?'action-btn toggle off':'action-btn toggle';html+='<div class="goods-row"><div class="goods-row-img '+grad+'"><img src="'+g.img+'" alt="'+g.name+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="fallback" style="display:none;">'+g.name+'</div></div><div class="goods-row-info"><div class="goods-row-name">'+g.name+' '+statusBadge+'</div><div class="goods-row-code">编号 '+(g.code||'-')+'</div><div class="goods-row-cat">'+(g.catId?getCatName(g.catId):'未分类')+'</div></div><div class="goods-row-actions"><div class="action-btn edit" onclick="editGoods('+g.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div><div class="'+toggleClass+'" onclick="toggleGoodsSellout('+g.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div><div class="action-btn del" onclick="delGoods('+g.id+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div></div></div>';});wrap.innerHTML=html;}
function filterRecords(filter,el){recordFilter=filter;document.querySelectorAll('.record-filter').forEach(function(f){f.classList.remove('active');});el.classList.add('active');renderRecords();}
function renderRecords(){var db=getDb();var list=db.orders;if(recordFilter==='pending'){list=list.filter(function(o){return o.status==='pending';});}else if(recordFilter==='done'){list=list.filter(function(o){return o.status==='done';});}var wrap=document.getElementById('recordsBody');if(list.length===0){wrap.innerHTML='<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">暂无记录</div></div>';return;}var html='';list.forEach(function(order){var statusText=order.status==='done'?'已处理':'待处理';var statusClass=order.status==='done'?'done':'pending';var count=0;order.items.forEach(function(it){count+=it.qty;});var itemsHtml='<div class="record-item-title">物品明细（'+count+'种）</div>';order.items.forEach(function(it){itemsHtml+='<div class="record-item-row"><span class="record-item-name">'+it.goodsName+' × '+it.qty+'</span><span class="record-item-code">编号 '+(it.code||'-')+'</span></div>';});var contactHtml='';if(order.userName)contactHtml+='<div><span class="icon">👤</span>'+order.userName+'</div>';if(order.userPhone)contactHtml+='<div><span class="icon">📞</span>'+order.userPhone+'</div>';if(order.userAddr)contactHtml+='<div><span class="icon">📍</span>'+order.userAddr+'</div>';if(order.note)contactHtml+='<div><span class="icon">📝</span>'+order.note+'</div>';var btnText=order.status==='done'?'↩ 恢复待处理':'✓ 标记已处理';var btnClass='record-action-btn';var delBtn=order.status==='done'?'<button class="record-action-btn del" onclick="delRecord(\''+order.orderNo+'\')">🗑 删除记录</button>':'';html+='<div class="record-card"><div class="record-head"><div><div class="record-no">'+order.orderNo+'</div><div class="record-device">设备ID：'+(order.deviceId||'-').substr(0,12)+'...</div></div><span class="order-status '+statusClass+'">'+statusText+'</span></div><div class="record-items">'+itemsHtml+'</div><div class="record-total"><span class="record-total-label">合计</span><span class="record-total-val">'+order.total+'</span></div><div class="record-contact">'+contactHtml+'</div><div class="record-time">'+order.createTime+'</div><button class="'+btnClass+'" onclick="toggleRecordStatus(\''+order.orderNo+'\')">'+btnText+'</button>'+delBtn+'</div>';});wrap.innerHTML=html;}
function toggleRecordStatus(orderNo){var db=getDb();var order=db.orders.find(function(o){return o.orderNo===orderNo;});if(!order)return;if(order.status==='done'){order.status='pending';showToast('已恢复为待处理');}else{order.status='done';showToast('已标记为已处理');}saveDb(db);renderRecords();}
function delRecord(orderNo){if(!confirm('确定删除这条已处理记录？删除后不可恢复。'))return;var db=getDb();db.orders=db.orders.filter(function(o){return o.orderNo!==orderNo;});saveDb(db);renderRecords();showToast('记录已删除');}
function renderBulletins(){var db=getDb();var wrap=document.getElementById('bulletinList');if(db.bulletins.length===0){wrap.innerHTML='<div class="empty"><div class="empty-icon">📢</div><div class="empty-text">暂无公告</div></div>';return;}var html='';db.bulletins.forEach(function(b){var statusBadge=b.enable?'<span style="color:var(--success);font-size:12px;">已启用</span>':'<span style="color:var(--warning);font-size:12px;">已关闭</span>';var toggleBtn=b.enable?'<button class="bulletin-btn disable" onclick="toggleBulletin(\''+b.id+'\')">关闭公告</button>':'<button class="bulletin-btn enable" onclick="toggleBulletin(\''+b.id+'\')">启用公告</button>';html+='<div class="bulletin-item"><div class="bulletin-content">'+b.content+' '+statusBadge+'</div><div class="bulletin-actions">'+toggleBtn+'<button class="bulletin-btn del" onclick="delBulletin(\''+b.id+'\')">删除</button></div></div>';});wrap.innerHTML=html;}
function addBulletin(){var content=document.getElementById('newBulletin').value.trim();if(!content){showToast('请输入公告内容');return;}var enable=document.getElementById('newBulletinEnable').checked;var db=getDb();db.bulletins.push({id:'bul_'+Date.now(),content:content,enable:enable});saveDb(db);document.getElementById('newBulletin').value='';renderBulletins();showToast('公告发布成功');}
function toggleBulletin(id){var db=getDb();var b=db.bulletins.find(function(x){return x.id==id;});if(!b)return;b.enable=!b.enable;saveDb(db);renderBulletins();showToast(b.enable?'已启用':'已关闭');}
function delBulletin(id){if(!confirm('确定删除这条公告？'))return;var db=getDb();db.bulletins=db.bulletins.filter(function(b){return b.id!=id;});saveDb(db);renderBulletins();showToast('已删除');}
function changePwd(){var oldP=document.getElementById('oldPwd').value.trim();var newP=document.getElementById('newPwd').value.trim();var confirmP=document.getElementById('confirmPwd').value.trim();var db=getDb();var admin=db.adminAccounts.find(function(a){return a.username===curUser;});if(!admin){showToast('账号不存在');return;}if(oldP!==admin.pwd){showToast('原密码错误');return;}if(newP.length<6){showToast('新密码至少6位');return;}if(newP!==confirmP){showToast('两次输入新密码不一致');return;}admin.pwd=newP;saveDb(db);showToast('密码修改成功，请重新登录');setTimeout(function(){doLogout();},1500);}
function showStorageUsage(){try{var used=JSON.stringify(localStorage).length;var limit=5*1024*1024;var pct=Math.min(100,Math.round(used/limit*100));var usedKB=(used/1024).toFixed(1);document.getElementById('storageUsage').innerText=usedKB+' KB / 5000 KB ('+pct+'%)';document.getElementById('storageBar').style.width=pct+'%';if(pct>=80){document.getElementById('storageBar').style.background='var(--danger)';}else if(pct>=60){document.getElementById('storageBar').style.background='var(--warning)';}else{document.getElementById('storageBar').style.background='var(--primary)';}}catch(e){document.getElementById('storageUsage').innerText='读取失败';}}
function compressAllImages(){if(!confirm('确定要压缩所有商品图片吗？这会重新处理所有大图，可释放大量存储空间。'))return;var db=getDb();var count=0;var total=db.goods.length;if(total===0){showToast('没有商品图片需要压缩');return;}db.goods.forEach(function(g){if(g.img&&g.img.indexOf('data:image')===0){var img=new Image();img.onload=function(){var maxW=500;var w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);g.img=canvas.toDataURL('image/jpeg',0.6);count++;if(count>=total){try{saveDb(db);showToast('已压缩'+count+'张图片，空间已释放');showStorageUsage();}catch(e){showToast('压缩后空间仍不足，请删除部分商品或订单');}}};img.src=g.img;}});if(db.goods.filter(function(g){return g.img&&g.img.indexOf('data:image')===0;}).length===0){showToast('没有需要压缩的图片');}}
function clearDoneOrders(){if(!confirm('确定要清空所有已处理订单吗？此操作不可恢复，待处理订单不受影响。'))return;var db=getDb();var before=db.orders.length;db.orders=db.orders.filter(function(o){return o.status!=='done';});var deleted=before-db.orders.length;saveDb(db);renderRecords();showStorageUsage();showToast('已删除'+deleted+'条已处理订单');}
function renderAdminList(){var db=getDb();var wrap=document.getElementById('adminList');if(db.adminAccounts.length===0){wrap.innerHTML='<div class="empty"><div class="empty-icon">👥</div><div class="empty-text">暂无管理员</div></div>';return;}var html='';db.adminAccounts.forEach(function(a){var roleBadge=a.role==='super'?'<span class="status-badge normal">超级管理员</span>':'<span class="status-badge" style="background:#e8f5f3;color:var(--primary);">普通管理员</span>';var delBtn=a.username===curUser?'':'<div class="cat-del" onclick="delAdmin(\''+a.username+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>';html+='<div class="cat-list-item"><span class="cat-name">'+a.username+' '+roleBadge+'</span>'+delBtn+'</div>';});wrap.innerHTML=html;}
function addAdmin(){var u=document.getElementById('newAdminUser').value.trim().toLowerCase();var p=document.getElementById('newAdminPwd').value.trim();if(!u||!p){showToast('请输入账号和密码');return;}if(p.length<6){showToast('密码至少6位');return;}var db=getDb();if(db.adminAccounts.find(function(a){return a.username.toLowerCase()===u;})){showToast('该账号已存在');return;}db.adminAccounts.push({username:u,pwd:p,role:'normal'});saveDb(db);document.getElementById('newAdminUser').value='';document.getElementById('newAdminPwd').value='';renderAdminList();showToast('管理员添加成功');}
function delAdmin(username){if(!confirm('确定删除该管理员？'))return;var db=getDb();db.adminAccounts=db.adminAccounts.filter(function(a){return a.username!==username;});saveDb(db);renderAdminList();showToast('已删除');}
function renderReports(){var wrap=document.getElementById('reportsList');if(!wrap)return;if(SUPABASE_ENABLED){wrap.innerHTML='<div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">加载中...</div></div>';Promise.all([fetchReportsFromSupabase(),fetchBannedFromSupabase()]).then(function(results){var reports=results[0]||[];var banned=results[1]||[];if(reports.length===0){wrap.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">暂无举报记录</div></div>';return;}var html='';reports.forEach(function(r){var statusBadge=r.status==='done'?'<span class="status-badge done">已处理</span>':'<span class="status-badge pending">待处理</span>';var isBanned=banned.find(function(d){return d.device_id===r.device_id;});var banBtn=isBanned?'<button class="btn-sm" style="background:var(--success);" onclick="unbanDevice(\''+r.device_id+'\')">解除封禁</button>':'<button class="btn-sm" style="background:var(--danger);" onclick="banDevice(\''+r.device_id+'\',\''+r.id+'\')">封禁该设备</button>';var doneBtn=r.status==='done'?'':'<button class="btn-sm" style="background:var(--primary);" onclick="markReportDone(\''+r.id+'\')">标记已处理</button>';var delBtn='<button class="btn-sm" style="background:#fef0f0;color:var(--danger);" onclick="deleteReport(\''+r.id+'\')">删除</button>';html+='<div class="record-card"><div class="record-card-head"><span class="order-no">'+r.id+'</span>'+statusBadge+'</div><div class="record-items"><div class="order-item-row"><span class="order-item-name">举报类型：'+r.type+'</span></div>';if(r.content){html+='<div class="order-item-row"><span class="order-item-code">补充说明：'+r.content+'</span></div>';}html+='<div class="order-item-row"><span class="order-item-code">设备ID：'+r.device_id+'</span></div></div><div class="order-meta">'+r.time+'</div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">'+banBtn+doneBtn+delBtn+'</div></div>';});wrap.innerHTML=html;}).catch(function(e){wrap.innerHTML='<div class="empty"><div class="empty-icon">❌</div><div class="empty-text">加载失败：'+e.message+'</div></div>';});}else{var db=getDb();if(!db.reports||db.reports.length===0){wrap.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">暂无举报记录</div></div>';return;}var html='';db.reports.forEach(function(r){var statusBadge=r.status==='done'?'<span class="status-badge done">已处理</span>':'<span class="status-badge pending">待处理</span>';var isBanned=db.bannedDevices&&db.bannedDevices.find(function(d){return d.deviceId===r.deviceId;});var banBtn=isBanned?'<button class="btn-sm" style="background:var(--success);" onclick="unbanDevice(\''+r.deviceId+'\')">解除封禁</button>':'<button class="btn-sm" style="background:var(--danger);" onclick="banDevice(\''+r.deviceId+'\',\''+r.id+'\')">封禁该设备</button>';var doneBtn=r.status==='done'?'':'<button class="btn-sm" style="background:var(--primary);" onclick="markReportDone(\''+r.id+'\')">标记已处理</button>';var delBtn='<button class="btn-sm" style="background:#fef0f0;color:var(--danger);" onclick="deleteReport(\''+r.id+'\')">删除</button>';html+='<div class="record-card"><div class="record-card-head"><span class="order-no">'+r.id+'</span>'+statusBadge+'</div><div class="record-items"><div class="order-item-row"><span class="order-item-name">举报类型：'+r.type+'</span></div>';if(r.content){html+='<div class="order-item-row"><span class="order-item-code">补充说明：'+r.content+'</span></div>';}html+='<div class="order-item-row"><span class="order-item-code">设备ID：'+r.deviceId+'</span></div></div><div class="order-meta">'+r.time+'</div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">'+banBtn+doneBtn+delBtn+'</div></div>';});wrap.innerHTML=html;}}
function renderBannedDevices(){var wrap=document.getElementById('bannedList');if(!wrap)return;if(SUPABASE_ENABLED){wrap.innerHTML='<div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">加载中...</div></div>';fetchBannedFromSupabase().then(function(list){if(!list||list.length===0){wrap.innerHTML='<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">暂无封禁设备</div></div>';return;}var html='';list.forEach(function(d){html+='<div class="cat-list-item"><span class="cat-name">'+d.device_id+'<br><span style="font-size:12px;color:var(--text2);">封禁时间：'+d.time+'</span></span><button class="btn-sm" style="background:var(--success);" onclick="unbanDevice(\''+d.device_id+'\')">解除封禁</button></div>';});wrap.innerHTML=html;}).catch(function(e){wrap.innerHTML='<div class="empty"><div class="empty-icon">❌</div><div class="empty-text">加载失败：'+e.message+'</div></div>';});}else{var db=getDb();if(!db.bannedDevices||db.bannedDevices.length===0){wrap.innerHTML='<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">暂无封禁设备</div></div>';return;}var html='';db.bannedDevices.forEach(function(d){html+='<div class="cat-list-item"><span class="cat-name">'+d.deviceId+'<br><span style="font-size:12px;color:var(--text2);">封禁时间：'+d.time+'</span></span><button class="btn-sm" style="background:var(--success);" onclick="unbanDevice(\''+d.deviceId+'\')">解除封禁</button></div>';});wrap.innerHTML=html;}}
function banDevice(deviceId,reportId){try{var db=getDb();if(!db.bannedDevices)db.bannedDevices=[];if(!db.reports)db.reports=[];if(db.bannedDevices.find(function(d){return d.deviceId===deviceId;})){showToast('该设备已在封禁列表中');return;}var now=new Date();var timeStr=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();db.bannedDevices.push({deviceId:deviceId,time:timeStr,reason:'举报违规'});if(reportId){var r=db.reports.find(function(x){return x.id===reportId;});if(r)r.status='done';}saveDb(db);renderReports();renderBannedDevices();showToast('设备已封禁');if(SUPABASE_ENABLED){insertBannedToSupabase({device_id:deviceId,time:timeStr,reason:'举报违规'}).catch(function(e){console.warn('Supabase封禁同步失败:',e);});if(reportId){updateReportStatus(reportId,'done').catch(function(e){console.warn('Supabase举报状态更新失败:',e);});}}}catch(e){showToast('封禁失败：'+e.message);}}
function unbanDevice(deviceId){try{var db=getDb();if(!db.bannedDevices)db.bannedDevices=[];db.bannedDevices=db.bannedDevices.filter(function(d){return d.deviceId!==deviceId;});saveDb(db);renderReports();renderBannedDevices();showToast('已解除封禁');if(SUPABASE_ENABLED){deleteBannedFromSupabase(deviceId).catch(function(e){console.warn('Supabase解除封禁同步失败:',e);});}}catch(e){showToast('解除失败：'+e.message);}}
function markReportDone(reportId){var db=getDb();var r=db.reports.find(function(x){return x.id===reportId;});if(r){r.status='done';saveDb(db);renderReports();showToast('已标记为已处理');if(SUPABASE_ENABLED){updateReportStatus(reportId,'done').catch(function(e){console.warn('Supabase举报状态更新失败:',e);});}}}
function deleteReport(reportId){try{var db=getDb();if(db.reports){db.reports=db.reports.filter(function(r){return r.id!==reportId;});saveDb(db);}renderReports();showToast('举报记录已删除');if(SUPABASE_ENABLED){deleteReportFromSupabase(reportId).catch(function(e){console.warn('Supabase删除举报失败:',e);});}}catch(e){showToast('删除失败：'+e.message);}}

</script>
</body>
