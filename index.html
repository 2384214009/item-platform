<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>物品展示选择平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f5f9f8;color:#333;min-height:100vh;}
:root{--primary:#2eb4a8;--primary-dark:#1a8a7f;--primary-light:#e8f5f3;--bg:#f5f9f8;--card:#fff;--text:#333;--text2:#888;--text3:#bbb;--border:#eef2f1;--danger:#f56c6c;--warning:#e6a23c;--success:#67c23a;--radius:16px;--radius-sm:10px;--radius-btn:24px;}
.app{max-width:500px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:70px;}
.barrage{background:var(--primary-light);padding:10px 16px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;}
.barrage-icon{color:var(--primary);flex-shrink:0;font-size:14px;}
.barrage-text{flex:1;overflow:hidden;white-space:nowrap;position:relative;font-size:13px;color:var(--primary-dark);}
.barrage-scroll{display:inline-block;white-space:nowrap;animation:barrage 12s linear infinite;padding-left:100%;}
@keyframes barrage{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
.barrage-close{cursor:pointer;color:var(--text2);font-size:18px;line-height:1;padding:0 4px;flex-shrink:0;}
.header{padding:20px 16px 12px;}
.header h1{font-size:22px;font-weight:700;color:var(--primary);margin-bottom:4px;}
.header .sub{font-size:13px;color:var(--text2);}
.search-wrap{padding:0 16px 14px;}
.search-box{display:flex;align-items:center;background:#fff;border-radius:var(--radius-sm);padding:11px 14px;border:1px solid var(--border);}
.search-box svg{width:18px;height:18px;color:var(--text3);flex-shrink:0;}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:14px;margin-left:8px;color:var(--text);}
.cats{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cat{flex-shrink:0;padding:7px 18px;border-radius:20px;background:#fff;border:1px solid var(--border);font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s;}
.cat.active{background:var(--primary);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(46,180,168,.25);}
.goods-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 20px;}
.goods-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s;position:relative;}
.goods-card:active{transform:scale(.98);}
.goods-img{width:100%;aspect-ratio:1/1;overflow:hidden;position:relative;background:#f0f0f0;}
.goods-img img{width:100%;height:100%;object-fit:cover;display:block;}
.goods-img .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;text-align:center;padding:8px;position:absolute;top:0;left:0;}
.sellout-tag{position:absolute;top:8px;right:8px;background:rgba(245,108,108,.9);color:#fff;font-size:11px;padding:3px 8px;border-radius:4px;z-index:2;}
.goods-info{padding:10px 12px 12px;}
.goods-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.goods-code{font-size:12px;color:var(--text2);margin-bottom:10px;}
.goods-btn{width:100%;padding:8px 0;border-radius:var(--radius-btn);font-size:13px;font-weight:600;cursor:pointer;border:none;text-align:center;}
.goods-btn.active{background:var(--primary);color:#fff;}
.goods-btn.disabled{background:#f0f0f0;color:var(--text3);cursor:not-allowed;}
.grad-1{background:linear-gradient(135deg,#667eea,#764ba2)!important;}
.grad-2{background:linear-gradient(135deg,#f093fb,#f5576c)!important;}
.grad-3{background:linear-gradient(135deg,#4facfe,#00f2fe)!important;}
.grad-0{background:linear-gradient(135deg,#a8edea,#fed6e3)!important;}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;}
.empty-icon{font-size:42px;margin-bottom:12px;opacity:.5;}
.empty-text{font-size:14px;color:var(--text2);}
.empty-link{color:var(--primary);font-size:13px;margin-top:8px;cursor:pointer;display:inline-block;}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#fff;display:flex;justify-content:space-around;align-items:center;padding:8px 0 12px;box-shadow:0 -2px 12px rgba(0,0,0,.05);z-index:400;}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);font-size:11px;flex:1;}
.tab-item svg{width:22px;height:22px;}
.tab-item.active{color:var(--primary);}
.fab{position:fixed;right:calc(50% - 240px);bottom:90px;width:50px;height:50px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(46,180,168,.4);cursor:pointer;z-index:99;touch-action:none;user-select:none;}
@media(max-width:520px){.fab{right:16px;}}
.fab svg{width:22px;height:22px;}
.fab-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;font-weight:600;}
.mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.mask.show{display:flex;}
.sheet{background:#fff;width:100%;max-width:500px;max-height:85vh;border-radius:16px 16px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-head{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.sheet-title{font-size:16px;font-weight:600;}
.sheet-close{cursor:pointer;color:var(--text2);font-size:22px;line-height:1;padding:4px;}
.sheet-body{flex:1;overflow-y:auto;padding:16px;}
.sheet-foot{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;background:#fff;}
.sheet-total{font-size:16px;font-weight:700;}
.sheet-total span{color:var(--primary);}
.sheet-btn{background:var(--primary);color:#fff;border:none;padding:13px 22px;border-radius:var(--radius-btn);font-size:15px;cursor:pointer;font-weight:700;flex:1;max-width:62%;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 8px rgba(46,180,168,.3);}
.sheet-btn:active{transform:scale(.97);}
.empty-btn{margin-top:14px;background:var(--primary);color:#fff;border:none;padding:10px 24px;border-radius:var(--radius-btn);font-size:14px;font-weight:600;cursor:pointer;}
.sheet-btn:disabled{background:#ddd;cursor:not-allowed;}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.cart-item:last-child{border-bottom:none;}
.cart-img{width:54px;height:54px;border-radius:10px;overflow:hidden;background:#f0f0f0;flex-shrink:0;position:relative;}
.cart-img img{width:100%;height:100%;object-fit:cover;display:block;}
.cart-img .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;text-align:center;padding:2px;position:absolute;top:0;left:0;}
.cart-info{flex:1;min-width:0;}
.cart-name{font-size:14px;font-weight:500;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cart-code{font-size:12px;color:var(--text2);}
.cart-qty{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--text);}
.qty-num{font-size:14px;min-width:20px;text-align:center;font-weight:600;}
.form-group{margin-bottom:16px;}
.form-label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block;}
.form-input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:border-color .2s;background:#fff;}
.form-input:focus{border-color:var(--primary);}
.form-textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;resize:vertical;min-height:70px;font-family:inherit;background:#fff;}
.form-textarea:focus{border-color:var(--primary);}
.page{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:100vh;background:var(--bg);z-index:300;display:none;flex-direction:column;overflow-y:auto;padding-bottom:70px;}
.page.show{display:flex;}
.page-head{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.04);flex-shrink:0;}
.page-back{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.page-title-wrap{flex:1;min-width:0;}
.page-title{font-size:18px;font-weight:700;}
.page-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.page-body{flex:1;padding:16px;}
.detail-hero{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;background:#f0f0f0;flex-shrink:0;}
.detail-hero img{width:100%;height:100%;object-fit:cover;display:block;}
.detail-hero .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:700;text-align:center;padding:16px;position:absolute;top:0;left:0;}
.detail-back{position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;backdrop-filter:blur(4px);}
.detail-content{flex:1;padding:16px;}
.detail-code{font-size:13px;color:var(--text2);margin-bottom:6px;}
.detail-name{font-size:22px;font-weight:700;margin-bottom:8px;}
.detail-cat{display:inline-block;padding:3px 12px;border-radius:12px;background:var(--primary-light);color:var(--primary-dark);font-size:12px;margin-bottom:14px;}
.detail-desc{font-size:14px;color:#666;line-height:1.7;margin-bottom:20px;}
.detail-qty{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:20px;}
.detail-qty-label{font-size:14px;color:var(--text);}
.detail-qty-ctrl{display:flex;align-items:center;gap:14px;}
.detail-qty-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;}
.detail-qty-btn.plus{background:var(--primary);color:#fff;border-color:transparent;}
.detail-qty-num{font-size:16px;font-weight:600;min-width:24px;text-align:center;}
.detail-foot{position:sticky;bottom:0;background:#fff;padding:12px 16px;display:flex;gap:12px;box-shadow:0 -2px 10px rgba(0,0,0,.05);flex-shrink:0;}
.detail-btn{flex:1;padding:12px;border-radius:var(--radius-btn);font-size:15px;font-weight:600;cursor:pointer;border:none;}
.detail-btn.outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
.detail-btn.solid{background:var(--primary);color:#fff;}
.order-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.order-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.order-no{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.3px;}
.order-status{padding:4px 12px;border-radius:12px;font-size:11px;font-weight:600;flex-shrink:0;margin-left:8px;}
.order-status.pending{background:#fff7e6;color:var(--warning);}
.order-status.done{background:#f0f9eb;color:var(--success);}
.order-items{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;}
.order-item-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;}
.order-item-name{color:var(--text);}
.order-item-code{color:var(--text2);font-size:12px;}
.order-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);}
.order-total-label{font-size:13px;color:var(--text2);}
.order-total-val{font-size:18px;font-weight:700;color:var(--primary);}
.order-meta{font-size:12px;color:var(--text3);margin-top:8px;}
.od-section{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.od-section-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text);}
.od-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.od-item:last-child{border-bottom:none;}
.od-item-img{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#f0f0f0;flex-shrink:0;position:relative;}
.od-item-img img{width:100%;height:100%;object-fit:cover;display:block;}
.od-item-img .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;text-align:center;padding:2px;position:absolute;top:0;left:0;}
.od-item-info{flex:1;min-width:0;}
.od-item-name{font-size:14px;font-weight:500;margin-bottom:3px;}
.od-item-code{font-size:12px;color:var(--text2);}
.od-item-sub{font-size:14px;font-weight:600;color:var(--text);flex-shrink:0;}
.od-info-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;align-items:flex-start;}
.od-info-label{color:var(--text2);flex-shrink:0;display:flex;align-items:center;gap:6px;}
.od-info-value{color:var(--text);font-weight:500;max-width:65%;text-align:right;word-break:break-all;}
.od-total-row{display:flex;justify-content:space-between;padding:12px 0 0;border-top:1px solid var(--border);margin-top:8px;font-size:15px;font-weight:700;}
.od-total-val{color:var(--primary);}
.err-bar{position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px;z-index:9999;display:none;word-break:break-all;}
.err-bar.show{display:block;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;display:none;max-width:80%;text-align:center;}
.toast.show{display:block;}
.boot-loading{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.boot-spinner{width:38px;height:38px;border:3px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:bootspin .8s linear infinite;}
@keyframes bootspin{to{transform:rotate(360deg);}}
.boot-loading p{font-size:13px;color:var(--text2);}
.report-types{display:flex;flex-wrap:wrap;gap:8px;}
.report-type{padding:8px 16px;border-radius:20px;background:#fff;border:1px solid var(--border);font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s;}
.report-type.active{background:var(--primary);color:#fff;border-color:transparent;}
.banned-page{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;}
.banned-page.show{display:flex;}
.banned-content{max-width:420px;width:100%;text-align:center;color:#fff;}
.banned-icon{font-size:64px;margin-bottom:20px;animation:bannedPulse 2s ease-in-out infinite;}
@keyframes bannedPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.1);opacity:.8;}}
.banned-content h1{font-size:28px;font-weight:700;margin-bottom:12px;color:#ff6b6b;}
.banned-desc{font-size:14px;color:rgba(255,255,255,.7);line-height:1.7;margin-bottom:24px;}
.banned-detail{background:rgba(255,255,255,.08);border-radius:12px;padding:16px;margin-bottom:20px;text-align:left;}
.banned-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.1);}
.banned-row:last-child{border-bottom:none;}
.banned-row span:first-child{color:rgba(255,255,255,.5);}
.banned-row span:last-child{color:#fff;font-weight:500;}
.banned-tip{font-size:12px;color:rgba(255,255,255,.4);}
</style>
</head>
<body>
<div class="boot-loading" id="bootLoading"><div class="boot-spinner"></div><p>正在加载...</p></div>
<div class="err-bar" id="errBar"></div>
<div class="toast" id="toast"></div>
<div class="app" id="app">
  <div class="barrage" id="barrage">
    <span class="barrage-icon">📢</span>
    <div class="barrage-text"><span class="barrage-scroll" id="barrageScroll"></span></div>
    <span class="barrage-close" onclick="closeBarrage()">×</span>
  </div>
  <div class="header">
    <h1>物品展示选择平台</h1>
    <div class="sub">物品展示与信息登记平台</div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索物品关键词" oninput="onSearch(this.value)">
    </div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="goods-grid" id="goodsGrid"></div>
</div>
<div class="tabbar">
  <div class="tab-item active" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>首页</span>
  </div>
  <div class="tab-item" onclick="switchTab('record')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span>我的记录</span>
  </div>
  <div class="tab-item" onclick="switchTab('admin')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>管理入口</span>
  </div>
  <div class="tab-item" onclick="openReport()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    <span>举报</span>
  </div>
</div>
<div class="fab" id="fab" onclick="openCart()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
  <span class="fab-badge" id="fabBadge">0</span>
</div>
<div class="mask" id="cartMask">
  <div class="sheet">

<script>
/*==== Store 统一存储层 ====*/
/* ============================================================
 * Store —— 统一存储层（重构核心，前后台共用同一份逻辑）
 * 设计原则：
 * 1. 图片唯一主存储为 IndexedDB；localStorage 内 goods.img 永远只存
 *    "idb://key" 指针 / https外链 / 空串，任何读取路径都不再把指针
 *    原地替换成 base64，从根上杜绝"读不到图就把指针写坏"的问题。
 * 2. 保存走串行写队列：先 await 图片真正落 IDB，再写 LS 指针数据；
 *    写新值前滚动备份旧值，LS 损坏时按 备份1→备份2→IDB快照 逐级自愈。
 * 3. 启动必须 boot() 完成（IDB 预热 + 迁移自愈）后才渲染/允许写操作。
 * 4. 历史污染自愈：data:image 自动迁入 IDB；被写成 picsum 占位/空串
 *    但 IDB 中仍有原图的，自动恢复指针。
 * 5. IDB 不可用时降级 ls 模式（图片强压缩后直接存 LS），功能不瘫痪。
 * ============================================================ */
var Store = (function () {
  var DB_NAME = 'shop_images', DB_VER = 2;
  var S_IMG = 'images', S_BAK = 'backups';
  var LS_KEY = 'shop_db', LS_BAK1 = 'shop_db_bak1', LS_BAK2 = 'shop_db_bak2';
  var IMG_PREFIX = 'idb://';
  var idb = null, mode = 'idb';
  var imgCache = {};                 // key -> dataURL（boot 时全量预热）
  var memDb = null, booted = false;
  var waiters = [];
  var flushTimer = null, flushing = false, pending = false;
  var flushWaiters = [];              // flushing 期间到达的 flushNow 调用者，全部等本轮真正落盘后再回调
  var dirty = false;                  // 内存是否有尚未落盘的修改（防止冻结旧页面 pagehide 盲目覆盖新数据）
  var extReloadWaiters = [];          // 外部页面（其他标签/bfcache 恢复）数据变化后的重渲染回调
  var lastSnapAt = 0, saveErrorHandler = null;
  /* ===== 云端共享数据源（Supabase）：管理员发布、所有设备拉取，解决单机数据不互通 ===== */
  var CLOUD_URL = 'https://sfozgzaopzvxrsxbfyla.supabase.co/rest/v1/';
  var CLOUD_KEY = 'sb_publishable_H9gYwPXXuKQVpH6Q8XCnRw_yZ1dyaPp';
  var cloudSyncWaiters = [];   // 云端数据到达后的重渲染回调
  var cloudPulling = false, lastCloudPullAt = 0;
  var CLOUD_FP_KEY = 'shop_cloud_fp';   // 云端商品指纹 {id:updated_at}：增量同步依据，避免每次重复拉取全部图片

  var DEFAULT = {
    goods: [
      { id: 1, catId: 'aixi', name: '爱喜酸奶', code: 'No.23', desc: '经典酸奶口味，清爽顺滑', img: '', sellout: true },
      { id: 2, catId: 'aixi', name: '爱喜香芋', code: 'No.23', desc: '浓郁香芋风味，绵密细腻', img: '', sellout: false },
      { id: 3, catId: 'aixi', name: '爱喜茉莉', code: 'No.23', desc: '清新茉莉花香，回味悠长', img: '', sellout: false },
      { id: 4, catId: 'alishan', name: '阿里山天韵', code: 'No.38', desc: '阿里山经典系列，口感醇厚', img: '', sellout: false },
      { id: 5, catId: 'alishan', name: '阿里山芒果', code: 'No.38', desc: '热带芒果风味，果香四溢', img: '', sellout: false },
      { id: 6, catId: 'baile', name: '百乐原味', code: 'No.15', desc: '百乐经典原味，简约之选', img: '', sellout: false }
    ],
    categories: [
      { id: 'all', name: '全部', sort: 0 }, { id: 'aixi', name: '爱喜', sort: 1 },
      { id: 'alishan', name: '阿里山', sort: 2 }, { id: 'baile', name: '百乐', sort: 3 }
    ],
    bulletins: [{ id: 1, content: '欢迎使用物品展示选择平台，精选好物等你来选', enable: true }],
    cart: [], orders: [],
    adminAccounts: [
      { username: '2384214009', pwd: '13727733582q', role: 'super' },
      { username: 'admin', pwd: 'admin123', role: 'normal' }
    ],
    reports: [], bannedDevices: []
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function deepMergeDefaults(db) {
    var d = DEFAULT;
    ['bulletins', 'cart', 'orders', 'reports', 'bannedDevices'].forEach(function (k) {
      if (!Array.isArray(db[k])) db[k] = clone(d[k]);
    });
    if (!Array.isArray(db.goods)) db.goods = [];
    if (!Array.isArray(db.categories) || db.categories.length === 0) db.categories = clone(d.categories);
    if (!Array.isArray(db.adminAccounts) || db.adminAccounts.length === 0) db.adminAccounts = clone(d.adminAccounts);
    return db;
  }
  function safeParse(raw) { try { return JSON.parse(raw); } catch (e) { return null; } }

  /* ---------- IndexedDB 封装（全部 Promise 化，等事务真完成） ---------- */
  // 超时阈值（毫秒）：移动端微信/iOS WebView、旧标签占用版本锁时，IDB 可能
  // 只触发 onblocked 或干脆无任何回调，Promise 会永久挂起 → 启动遮罩永远转。
  var IDB_OPEN_TIMEOUT = 2500, IDB_TX_TIMEOUT = 3500, BOOT_HARD_TIMEOUT = 4500;
  function openIdb() {
    return new Promise(function (resolve, reject) {
      var settled = false, timer = null;
      var finish = function (fn, arg) { if (settled) return; settled = true; if (timer) clearTimeout(timer); fn(arg); };
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return reject(e); }
      req.onupgradeneeded = function (e) {
        try {
          var db0 = e.target.result;
          if (!db0.objectStoreNames.contains(S_IMG)) db0.createObjectStore(S_IMG);
          if (!db0.objectStoreNames.contains(S_BAK)) db0.createObjectStore(S_BAK);
        } catch (ex) { finish(reject, ex); }
      };
      req.onsuccess = function () { finish(resolve, req.result); };
      req.onerror = function () { finish(reject, req.error || new Error('IDB 打开失败')); };
      req.onblocked = function () {
        // 其他标签开着旧版页面占着版本锁：不傻等，直接 reject 走 ls 降级，保证能进页面
        try { if (req.result) req.result.close(); } catch (e) {}
        finish(reject, new Error('IDB 升级被其他标签页阻塞'));
      };
      timer = setTimeout(function () {
        try { if (req.result) req.result.close(); } catch (e) {}
        finish(reject, new Error('IDB 打开超时'));
      }, IDB_OPEN_TIMEOUT);
    });
  }
  function tx(storeName, mode2, fn) {
    return new Promise(function (resolve, reject) {
      var settled = false, timer = null;
      var finish = function (fn2, arg) { if (settled) return; settled = true; if (timer) clearTimeout(timer); fn2(arg); };
      var t;
      try { t = idb.transaction(storeName, mode2); } catch (e) { return reject(e); }
      var result;
      try { result = fn(t.objectStore(storeName), t); } catch (e) { return reject(e); }
      t.oncomplete = function () { finish(resolve, result); };
      t.onerror = function () { finish(reject, t.error || new Error('IDB 事务失败')); };
      t.onabort = function () { finish(reject, t.error || new Error('IDB 事务中止')); };
      timer = setTimeout(function () {
        try { t.abort(); } catch (e) {}
        finish(reject, new Error('IDB 事务超时'));
      }, IDB_TX_TIMEOUT);
    });
  }
  function idbPut(storeName, key, val) { return tx(storeName, 'readwrite', function (s) { s.put(val, key); }); }
  function idbDel(storeName, key) { return tx(storeName, 'readwrite', function (s) { s.delete(key); }); }
  function idbGetAll(storeName) {
    return new Promise(function (resolve, reject) {
      var settled = false, timer = null;
      var finish = function (fn, arg) { if (settled) return; settled = true; if (timer) clearTimeout(timer); fn(arg); };
      var out = {};
      try {
        var t = idb.transaction(storeName, 'readonly');
        var req = t.objectStore(storeName).openCursor();
        req.onsuccess = function () {
          var cur = req.result;
          if (cur) { out[cur.key] = cur.value; cur.continue(); } else finish(resolve, out);
        };
        req.onerror = function () { finish(reject, req.error); };
        t.onerror = function () { finish(reject, t.error); };
        t.onabort = function () { finish(reject, t.error || new Error('IDB 游标中止')); };
        timer = setTimeout(function () { try { t.abort(); } catch (e) {} finish(reject, new Error('IDB 读取超时')); }, IDB_TX_TIMEOUT);
      } catch (e) { reject(e); }
    });
  }

  /* ---------- LS 读取（带逐级备份自愈，绝不静默重置） ---------- */
  function readLsChain() {
    var order = [LS_KEY, LS_BAK1, LS_BAK2];
    for (var i = 0; i < order.length; i++) {
      var raw = null;
      try { raw = localStorage.getItem(order[i]); } catch (e) {}
      if (!raw) continue;
      var db = safeParse(raw);
      if (db && typeof db === 'object') return { db: db, source: order[i], raw: raw };
    }
    return null;
  }

  var PICSUM_RE = /^https:\/\/picsum\.photos\/seed\/(?:goods_|order_)?/;
  function imgKeyOf(id) { return 'img_' + id; }
  function isDataUrl(s) { return typeof s === 'string' && s.indexOf('data:image') === 0; }
  function isPointer(s) { return typeof s === 'string' && s.indexOf(IMG_PREFIX) === 0; }

  /* ---------- 启动 ---------- */
  function buildDbFromLsOrDefault() {
    var got = readLsChain();
    return deepMergeDefaults(got ? got.db : clone(DEFAULT));
  }
  // 幂等完成启动：任何路径只允许完成一次，保证 waiters 只触发一次
  function completeBoot(db) {
    if (booted) return Promise.resolve(memDb);
    memDb = db;
    booted = true;
    var ws = waiters; waiters = [];
    ws.forEach(function (fn) { try { fn(memDb); } catch (e) { console.error(e); } });
    // 首屏先用本机数据渲染，600ms 后异步拉云端权威数据覆盖（失败静默用本机缓存）
    if (typeof fetch === 'function') setTimeout(function () { try { cloudPull().catch(function () {}); } catch (e) {} }, 600);
    return Promise.resolve(memDb);
  }
  function boot() {
    var main = openIdb().then(function (db) {
      idb = db;
      return idbGetAll(S_IMG).catch(function () { return {}; });
    }).then(function (all) {
      imgCache = all || {};
    }).catch(function (err) {
      // IDB 不可用/被阻塞/打开超时 → 降级 ls 模式（图片将强压缩后直接进 LS）
      mode = 'ls'; idb = null;
      console.warn('[Store] IndexedDB 不可用，降级为 localStorage 模式', err);
    }).then(function () {
      var got = readLsChain();
      var db;
      if (got) {
        db = deepMergeDefaults(got.db);
      } else if (mode === 'idb') {
        // LS 全空/全损：尝试 IDB 快照
        return idbGetAll(S_BAK).then(function (snaps) {
          var keys = Object.keys(snaps).filter(function (k) { return k.indexOf('snap_') === 0; }).sort().reverse();
          if (keys.length) {
            var s = safeParse(snaps[keys[0]]);
            if (s && typeof s === 'object') return finishBoot(deepMergeDefaults(s), true);
          }
          return finishBoot(deepMergeDefaults(clone(DEFAULT)), false);
        }).catch(function () { return finishBoot(deepMergeDefaults(clone(DEFAULT)), false); });
      } else {
        db = deepMergeDefaults(clone(DEFAULT));
      }
      return finishBoot(db, false);
    });
    // 硬看门狗：无论上面哪个环节永久挂起，到点强制用 LS/默认数据完成启动，
    // 绝不让启动遮罩在手机上无限转圈（"一直加载进不去"的最后一道保险）
    var watchdog = new Promise(function (resolve) {
      setTimeout(function () {
        if (booted) return;
        console.warn('[Store] 启动硬超时，强制以本地数据启动（ls 降级）');
        mode = 'ls'; idb = null;
        resolve(completeBoot(buildDbFromLsOrDefault()));
      }, BOOT_HARD_TIMEOUT);
    });
    return Promise.race([main, watchdog]);
  }

  function finishBoot(db, fromSnap) {
    return migrate(db).then(function (res) {
      if (res.changed || fromSnap) { try { scheduleFlush(0); } catch (e) {} } // 仅当确实迁移/恢复时落盘
      return completeBoot(res.db);
    }, function () { return completeBoot(db); });
  }

  /* ---------- 历史数据迁移 / 污染自愈，返回 Promise<{db,changed}> ---------- */
  function migrate(db) {
    var jobs = [], changed = false;
    (db.goods || []).forEach(function (g) {
      var key = imgKeyOf(g.id);
      if (isDataUrl(g.img)) {
        if (mode === 'idb') {
          imgCache[key] = g.img;
          jobs.push(idbPut(S_IMG, key, g.img));
          g.img = IMG_PREFIX + key;
          changed = true;
        }
      } else if (isPointer(g.img)) {
        // 指针保留；缓存缺失也不做任何破坏性处理
      } else if (!g.img) {
        if (mode === 'idb' && imgCache[key]) { g.img = IMG_PREFIX + key; changed = true; } // 空串但 IDB 有图 → 救回
      } else if (PICSUM_RE.test(g.img)) {
        if (mode === 'idb' && imgCache[key]) { g.img = IMG_PREFIX + key; changed = true; } // 历史占位污染 → 恢复
      }
    });
    // 订单历史 base64 抽到 IDB；cart 去掉冗余 img 字段
    (db.orders || []).forEach(function (o) {
      (o.items || []).forEach(function (it) {
        if (isDataUrl(it.img) && mode === 'idb') {
          var k = 'order_img_' + (it.goodsName || ('x' + Date.now()));
          imgCache[k] = it.img; jobs.push(idbPut(S_IMG, k, it.img)); it.img = IMG_PREFIX + k; changed = true;
        }
      });
    });
    if (Array.isArray(db.cart)) db.cart.forEach(function (c) { if ('img' in c) { delete c.img; changed = true; } });
    return Promise.all(jobs).then(function () { return { db: db, changed: changed }; }).catch(function () { return { db: db, changed: changed }; });
  }

  /* ---------- 对外：图片解析（永不写回） ---------- */
  function imgSrc(ref) {
    if (!ref) return '';
    if (isPointer(ref)) return imgCache[ref.substring(IMG_PREFIX.length)] || '';
    return ref;
  }
  function imgExists(ref) {
    if (!ref) return false;
    if (isPointer(ref)) return !!imgCache[ref.substring(IMG_PREFIX.length)];
    return true;
  }
  function putImage(key, dataUrl) {
    imgCache[key] = dataUrl;
    if (mode === 'idb') return idbPut(S_IMG, key, dataUrl);
    return Promise.resolve();
  }
  function removeImage(key) {
    delete imgCache[key];
    if (mode === 'idb') return idbDel(S_IMG, key).catch(function () {});
    return Promise.resolve();
  }

  /* ---------- 对外：数据读写 ---------- */
  function onReady(fn) { if (booted) fn(memDb); else waiters.push(fn); }
  function get() { return memDb; }
  // 兼容旧签名 saveDb(db)：传了就整体替换
  function save(incoming) {
    if (incoming && incoming !== memDb) memDb = incoming;
    dirty = true;
    scheduleFlush(120);
  }
  function scheduleFlush(delay) {
    if (flushTimer) clearTimeout(flushTimer);
    flushTimer = setTimeout(doFlush, delay);
  }
  function flushNow() { if (flushTimer) { clearTimeout(flushTimer); flushTimer = null; } return doFlush(); }
  // 仅在确有未落盘修改时才写，避免 bfcache 冻结的旧页面在 pagehide 时用旧内存覆盖新数据
  function flushIfDirty() { return dirty ? flushNow() : Promise.resolve(); }
  function isDirty() { return dirty; }
  // 从磁盘重新读取最新数据替换内存（其他页面写入 / bfcache 返回时同步用，只读不写）
  function reloadFromDisk() {
    var warm = (mode === 'idb' && idb) ? idbGetAll(S_IMG).catch(function () { return {}; }).then(function (all) { imgCache = all || {}; }) : Promise.resolve();
    return warm.then(function () {
      var got = readLsChain();
      memDb = deepMergeDefaults(got ? got.db : clone(DEFAULT));
      dirty = false; // 内存已与磁盘对齐
      return memDb;
    });
  }
  function onExternalReload(fn) { extReloadWaiters.push(fn); }
  function notifyExternalReload() {
    extReloadWaiters.forEach(function (fn) { try { fn(memDb); } catch (e) { console.error(e); } });
  }
  // 多页面/手机返回键同步：①storage 事件（其他文档写 LS 时本页收到，自己写不触发）

  function bindSyncListeners() {
    if (typeof window === 'undefined' || typeof window.addEventListener !== 'function') return;
    window.addEventListener('storage', function (e) {
      if (!e.key || e.key.indexOf('shop_db') !== 0) return;
      if (dirty) return; // 本页自己有未落盘修改时不被外部覆盖（极短窗口）
      reloadFromDisk().then(notifyExternalReload).catch(function () {});
    });

  // 把内存态中的 dataURL 图片搬入 IDB，并把内存字段同步替换为指针。
  // 必须改 memDb 本身（而不是只改序列化快照），否则 GC 会把刚写入的图误判为孤儿删掉。
  function swapMemImages(db) {
    var puts = [];
    function swap(obj, field, id, prefix) {
      var val = obj[field];
      if (!isDataUrl(val)) return;
      if (mode === 'ls') return; // 降级模式直接保留（上传时已强压缩）
      var key = (prefix || 'img_') + id;
      imgCache[key] = val;
      puts.push(idbPut(S_IMG, key, val));
      obj[field] = IMG_PREFIX + key;
    }
    (db.goods || []).forEach(function (g) { swap(g, 'img', g.id, 'img_'); });
    (db.orders || []).forEach(function (o) {
      (o.items || []).forEach(function (it) { if (it.img) swap(it, 'img', (it.goodsName || ('x' + Date.now())), 'order_img_'); });
    });
    return Promise.all(puts);
  }

  function writeLs(str) {
    var oldRaw = '';
    try { oldRaw = localStorage.getItem(LS_KEY) || ''; } catch (e) {}
    try {
      localStorage.setItem(LS_KEY, str);
      return true;
    } catch (e) {
      // 配额不足：先腾挪备份与非关键 key，再重试一次
      try {
        localStorage.removeItem(LS_BAK2);
        localStorage.removeItem(LS_BAK1);
        ['fab_pos', 'barrage_closed'].forEach(function (k) { try { localStorage.removeItem(k); } catch (x) {} });
        localStorage.setItem(LS_KEY, str);
        return true;
      } catch (e2) {
        // 回滚：保留旧数据
        if (oldRaw) { try { localStorage.setItem(LS_KEY, oldRaw); } catch (x) {} }
        throw e2;
      }
    }
  }

  function doFlush() {

    if (flushing) {
      pending = true;
      return new Promise(function (resolve, reject) { flushWaiters.push({ resolve: resolve, reject: reject }); });
    }
    flushing = true;
    function settleWaiters(err, val) {
      var w = flushWaiters; flushWaiters = [];
      w.forEach(function (x) { if (err) x.reject(err); else x.resolve(val); });
    }
    // 1) 先把内存态里的图片真正写入 IDB 并就地换成指针（memDb 与磁盘保持一致）
    return swapMemImages(memDb).then(function () {
      var snapshot = clone(memDb);
      var str = JSON.stringify(snapshot);
      // 写新值前先滚动备份旧值（空间够才留双份）
      try {
        var old = localStorage.getItem(LS_KEY);
        if (old) {
          var prev1 = localStorage.getItem(LS_BAK1);
          if (prev1) { try { localStorage.setItem(LS_BAK2, prev1); } catch (e) {} }
          try { localStorage.setItem(LS_BAK1, old); } catch (e) {}
        }
      } catch (e) {}
      writeLs(str);
      dirty = false; // LS 已真正写入
      return afterWrite(str);
    }).catch(function (err) {
      console.error('[Store] 落盘失败', err);
      if (saveErrorHandler) try { saveErrorHandler(err); } catch (e) {}
      throw err;
    }).then(function (r) {
      flushing = false;
      if (pending) {
        pending = false;
        return doFlush().then(function (r2) { settleWaiters(null, r2); return r2; },
          function (e) { settleWaiters(e); throw e; });

      settleWaiters(null, r);
      return r;
    }, function (err) {
      flushing = false;
      if (pending) {
        pending = false;
        return doFlush().then(function (r2) { settleWaiters(null, r2); return r2; },
          function (e) { settleWaiters(e); throw e; });

    // 误删风险高于孤儿占用，删图只走"删除商品"显式路径与后台手动清理。
    var jobs = [];
    if (mode === 'idb' && Date.now() - lastSnapAt > 60000) {
      lastSnapAt = Date.now();
      var snapKey = 'snap_' + lastSnapAt;
      jobs.push(idbPut(S_BAK, snapKey, str).then(function () {
        return idbGetAll(S_BAK).then(function (snaps) {
          var keys = Object.keys(snaps).filter(function (k) { return k.indexOf('snap_') === 0; }).sort();
          var dels = [];
          while (keys.length > 3) { var old2 = keys.shift(); dels.push(idbDel(S_BAK, old2)); }
          return Promise.all(dels);
        });
      }).catch(function () {}));
    }
    return Promise.all(jobs);
  }

  function referencedKeys() {
    var refs = {};
    (memDb.goods || []).forEach(function (g) { if (isPointer(g.img)) refs[g.img.substring(IMG_PREFIX.length)] = 1; });
    (memDb.orders || []).forEach(function (o) {
      (o.items || []).forEach(function (it) { if (isPointer(it.img)) refs[it.img.substring(IMG_PREFIX.length)] = 1; });
    });
    return refs;
  }

  // 避免在数据未加载/异常空库状态下把全部图片误删；返回回收数量。
  function collectGarbage() {
    if (mode !== 'idb') return Promise.resolve(0);
    if (!memDb || !Array.isArray(memDb.goods) || memDb.goods.length === 0) return Promise.resolve(0);
    var refs = referencedKeys();
    var removed = 0, dels = [];
    Object.keys(imgCache).forEach(function (k) {
      if ((k.indexOf('img_') === 0 || k.indexOf('order_img_') === 0) && !refs[k]) {

        dels.push(idbDel(S_IMG, k).catch(function () {}));
      }
    });

  /* ---------- 备份导出 / 导入（自包含，含原图） ---------- */
  function exportBundle() {
    var bundle = clone(memDb);
    bundle._backupAt = new Date().toLocaleString();
    bundle._version = 2;
    bundle.goods.forEach(function (g) { if (isPointer(g.img)) g.img = imgCache[g.img.substring(IMG_PREFIX.length)] || g.img; });
    (bundle.orders || []).forEach(function (o) {
      (o.items || []).forEach(function (it) { if (isPointer(it.img)) it.img = imgCache[it.img.substring(IMG_PREFIX.length)] || it.img; });
    });
    return JSON.stringify(bundle);
  }
  function importBundle(jsonText) {
    var obj = safeParse(jsonText);
    if (!obj || typeof obj !== 'object' || !Array.isArray(obj.goods)) return Promise.reject(new Error('备份文件格式不正确'));
    deepMergeDefaults(obj);
    return migrate(obj).then(function (res) {
      memDb = res.db;
      return doFlush().then(function () { return memDb; });
    });
  }

  /* ---------- 空间估算 ---------- */
  function usage() {
    var lsBytes = 0;
    try { lsBytes = JSON.stringify(localStorage).length; } catch (e) {}
    var idbBytes = 0;
    Object.keys(imgCache).forEach(function (k) { idbBytes += (imgCache[k] || '').length; });
    return {
      mode: mode,
      lsKB: (lsBytes / 1024).toFixed(1),
      idbKB: (idbBytes / 1024).toFixed(1),
      imgCount: Object.keys(imgCache).filter(function (k) { return k.indexOf('img_') === 0 || k.indexOf('order_img_') === 0; }).length
    };
  }

    if (navigator.storage && navigator.storage.estimate) return navigator.storage.estimate();

  }

  /* ================= 云端共享数据源（Supabase REST） =================
   * 解决"管理员本机新增物品、其他设备看不到"：云端为商品/分类/公告的权威源，
   * 任何设备启动后异步拉取覆盖本机；管理员增删改同步写云端。购物车/订单/
   * 管理员账号/举报仍只存本机（各设备私有）。 */
  function cloudReq(path, opts) {
    opts = opts || {};
    var timeoutMs = opts.timeout || 25000;
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, timeoutMs);
    var init = { method: opts.method || 'GET', headers: { 'apikey': CLOUD_KEY, 'Authorization': 'Bearer ' + CLOUD_KEY, 'Content-Type': 'application/json' } };
    if (opts.prefer) init.headers['Prefer'] = opts.prefer;
    if (opts.body !== undefined) init.body = JSON.stringify(opts.body);
    if (ctrl) init.signal = ctrl.signal;
    return fetch(CLOUD_URL + path, init).then(function (r) {
      clearTimeout(timer);
      // 统一先读文本：失败时把数据库(PostgREST)返回的 code/message 带进异常，便于精确定位，不再只抛笼统的 HTTP 码
      return r.text().then(function (txt) {
        if (!r.ok) {

          try { var j = JSON.parse(txt); detail = (j.code ? '[' + j.code + '] ' : '') + (j.message || '') + (j.hint ? '（' + j.hint + '）' : ''); }
          catch (e) { detail = (txt || '').slice(0, 150); }
          throw new Error('云端请求失败 HTTP ' + r.status + (detail ? '：' + detail : ''));
        }

        if (!txt) return null;
        try { return JSON.parse(txt); } catch (e) { return null; }

    }, function (e) { clearTimeout(timer); throw e; });

  // 弱网/抖动自动重试：网络层错误(无HTTP码=断连/超时/中断)、408/409/413/429/5xx 可重试；
  // 其余 4xx（如数据格式错误）重试无意义，立即抛出。退避 0.8s/1.6s/2.4s。
  function cloudReqRetry(path, opts, retries) {

  // 取商品真实图片 dataURL：idb 指针→imgCache 取出；picsum 外链/空→空（不上云无效外链）
  function realImg(ref) {
    if (!ref) return '';
    if (isPointer(ref)) return imgCache[ref.substring(IMG_PREFIX.length)] || '';
    if (isDataUrl(ref)) return ref;
    if (PICSUM_RE.test(ref)) return '';
    return ref;
  }
  // 云端 cloud_goods.sort 列为 integer(int4，上限约 21.4 亿)，绝不能塞 Date.now 级 13 位大 id，
  // 否则触发 22003 "out of range for type integer" 被 400 拒绝；统一用商品在本机列表的序号(小整数)。
  function goodsSortOf(g) {
    var i = -1;
    if (memDb && memDb.goods) {
      for (var k = 0; k < memDb.goods.length; k++) {
        if (memDb.goods[k] === g || String(memDb.goods[k].id) === String(g.id)) { i = k; break; }
      }
    }

    return { id: goodsIdOf(g), cat_id: g.catId || '', name: g.name, code: g.code || '', descr: g.desc || '', img: realImg(g.img), sellout: !!g.sellout, sort: goodsSortOf(g), updated_at: new Date().toISOString() };
  }
  function rowToGoods(r) {

  }
  // ===== 增量同步：避免每次打开都重复拉取全部商品图（阶段一省流量核心） =====

  function writeCloudFp(rows) { try { var fp = {}; (rows || []).forEach(function (r) { fp[r.id] = r.updated_at; }); localStorage.setItem(CLOUD_FP_KEY, JSON.stringify(fp)); } catch (e) {} }

  function ingestGoodsRows(rows) {
    var goods = (rows || []).map(rowToGoods), imgJobs = [];
    goods.forEach(function (g) {

  // 应用分类/公告 + 落盘 + 触发界面重渲染
  function applyCloudMetaAndFlush(cRows, bRows) {
    if (cRows && cRows.length) memDb.categories = cRows.map(function (c) { return { id: c.id, name: c.name, sort: c.sort }; });
    if (bRows && bRows.length) memDb.bulletins = bRows.map(function (b) { return { id: b.id, content: b.content, enable: b.enable !== false }; });

    });

  // 全量拉取（=改造前逻辑）：首次访问/清缓存/增量异常兜底时使用，保证行为不变、不白屏
  function cloudPullFull() {
    return Promise.all([
      cloudReqRetry('cloud_goods?select=*&order=sort.asc.nullslast', { timeout: 40000 }, 2),
      cloudReqRetry('cloud_categories?select=*&order=sort.asc.nullslast', { timeout: 40000 }, 2),
      cloudReqRetry('cloud_bulletins?select=*', { timeout: 40000 }, 2)
    ]).then(function (res) {
      var gRows = res[0] || [], cRows = res[1] || [], bRows = res[2] || [];

      return ingestGoodsRows(gRows).then(function (goods) {
        memDb.goods = goods;

  // 按 id 批量拉完整商品(含图)，每批≤30，防止 in 列表/URL 过长
  function fetchGoodsByIds(ids) {
    var jobs = [];
    for (var i = 0; i < ids.length; i += 30) {
      var part = ids.slice(i, i + 30);
      jobs.push(cloudReqRetry('cloud_goods?id=in.(' + part.join(',') + ')&select=*', { timeout: 60000 }, 2));
    }
    return Promise.all(jobs).then(function (arr) { var all = []; arr.forEach(function (a) { if (a) all = all.concat(a); }); return ingestGoodsRows(all); });
  }
  // 增量拉取：先拉【不含图】的轻量元数据做指纹比对，只拉新增/变更物品的图，未变物品沿用本机(含本地图，零图片流量)
  function cloudPullIncremental() {
    return Promise.all([
      cloudReqRetry('cloud_goods?select=id,updated_at,sort&order=sort.asc.nullslast', { timeout: 40000 }, 2),
      cloudReqRetry('cloud_categories?select=*&order=sort.asc.nullslast', { timeout: 40000 }, 2),
      cloudReqRetry('cloud_bulletins?select=*', { timeout: 40000 }, 2)
    ]).then(function (res) {
      var meta = res[0] || [], cRows = res[1] || [], bRows = res[2] || [];
      lastCloudPullAt = Date.now();
      if (!booted || meta.length === 0) return { empty: true };
      var fp = readCloudFp();
      var changed = [], cloudIds = {};
      meta.forEach(function (r) {
        var sid = String(r.id); cloudIds[sid] = true;
        if (!fp || fp[sid] === undefined || fp[sid] !== r.updated_at) changed.push(Number(r.id));
      });
      var removed = [];
      if (fp) Object.keys(fp).forEach(function (sid) { if (!cloudIds[sid]) removed.push(Number(sid)); });
      // 无新增/变更/删除 → 商品与图片完全不动，仅顺手更新分类/公告（近乎零流量）
      if (changed.length === 0 && removed.length === 0) {
        return applyCloudMetaAndFlush(cRows, bRows).then(function () { return { empty: false, count: meta.length, mode: 'cached' }; });
      }
      return fetchGoodsByIds(changed).then(function (changedGoods) {
        var changedMap = {}, localMap = {};
        changedGoods.forEach(function (g) { changedMap[String(g.id)] = g; });
        (memDb.goods || []).forEach(function (g) { localMap[String(g.id)] = g; });
        var result = [], delJobs = [];
        meta.forEach(function (r) {
          var sid = String(r.id);
          if (changedMap[sid]) result.push(changedMap[sid]);
          else if (localMap[sid]) result.push(localMap[sid]); // 未变物品沿用本机对象，保留 idb:// 图指针，绝不丢图
        });
        removed.forEach(function (id) { // 云端已删物品：移出并清掉其本地图片
          var old = localMap[String(id)];
          if (old && isPointer(old.img)) delJobs.push(idbDel(S_IMG, imgKeyOf(id)).catch(function () {}));
        });
        memDb.goods = result;
        writeCloudFp(meta);
        return Promise.all(delJobs).catch(function () {}).then(function () { return applyCloudMetaAndFlush(cRows, bRows); });
      }).then(function () { return { empty: false, count: meta.length, mode: 'incremental', changed: changed.length, removed: removed.length }; });
    });
  }
  // 拉取云端权威数据：有指纹走增量(省流量)，无指纹走全量；增量异常自动回退全量，全量再失败静默用本机
  function cloudPull() {
    if (cloudPulling) return Promise.resolve(null);
    cloudPulling = true;
    var done = function (r) { cloudPulling = false; return r; };
    var fail = function (e) {
      cloudPulling = false;
      console.warn('[Store] 云端拉取失败，使用本机缓存数据', e && e.message);
      return { error: e && e.message };
    };
    if (!readCloudFp()) return cloudPullFull().then(done, fail);
    return cloudPullIncremental().then(done, function (e) {
      console.warn('[Store] 增量同步异常，回退全量拉取', e && e.message);
      return cloudPullFull().then(done, fail);
    });
  }
  // ---- 管理员写云端（失败不阻断本机保存，返回 Promise 供界面提示/重试） ----
  function cloudUpsertGoods(g) { return cloudReqRetry('cloud_goods', { method: 'POST', prefer: 'resolution=merge-duplicates', body: goodsToRow(g), timeout: 60000 }, 3); }
  function cloudDeleteGoods(id) { return cloudReqRetry('cloud_goods?id=eq.' + encodeURIComponent(id), { method: 'DELETE', timeout: 60000 }, 3); }
  function cloudUpsertCat(c) { return cloudReqRetry('cloud_categories', { method: 'POST', prefer: 'resolution=merge-duplicates', body: { id: String(c.id), name: c.name, sort: c.sort || 0 }, timeout: 60000 }, 3); }
  function cloudDeleteCat(id) { return cloudReqRetry('cloud_categories?id=eq.' + encodeURIComponent(id), { method: 'DELETE', timeout: 60000 }, 3); }
  function bullIdToNum(id) { return Number(String(id).replace(/\D/g, '')) || Date.now(); }
  function cloudUpsertBulletin(b) { return cloudReqRetry('cloud_bulletins', { method: 'POST', prefer: 'resolution=merge-duplicates', body: { id: bullIdToNum(b.id), content: b.content, enable: b.enable !== false }, timeout: 60000 }, 3); }
  function cloudDeleteBulletin(id) { return cloudReqRetry('cloud_bulletins?id=eq.' + encodeURIComponent(bullIdToNum(id)), { method: 'DELETE', timeout: 60000 }, 3); }
  // 商品按累计 JSON 体积切批：国内网络直连 Supabase 海外节点时，整包(含全部 base64 图)越大越易被
  // 中断/超时；切成每批 ≤400KB（通常 1~2 件带图商品）小包，弱网成功率显著提高。
  function chunkGoodsRows(rows, maxBytes) {
    var batches = [], cur = [], curSize = 0;
    rows.forEach(function (r) {
      var size = JSON.stringify(r).length;
      if (cur.length && curSize + size > maxBytes) { batches.push(cur); cur = []; curSize = 0; }
      cur.push(r); curSize += size;
    });
    if (cur.length) batches.push(cur);
    return batches;
  }
  // 一键全量发布：先发分类/公告小包，再把商品分片【串行】上传，每片自动重试；
  // onProgress({done,total}) 回调上传进度；个别片最终失败时汇总抛出，已成功片幂等不重复。
  function cloudPublishAll(onProgress) {
    var goodsRows = memDb.goods.map(goodsToRow);
    var catRows = memDb.categories.filter(function (c) { return c.id !== 'all'; }).map(function (c) { return { id: String(c.id), name: c.name, sort: c.sort || 0 }; });
    var bullRows = memDb.bulletins.map(function (b) { return { id: bullIdToNum(b.id), content: b.content, enable: b.enable !== false }; });
    var metaJobs = [];
    if (catRows.length) metaJobs.push(cloudReqRetry('cloud_categories', { method: 'POST', prefer: 'resolution=merge-duplicates', body: catRows, timeout: 60000 }, 3));
    if (bullRows.length) metaJobs.push(cloudReqRetry('cloud_bulletins', { method: 'POST', prefer: 'resolution=merge-duplicates', body: bullRows, timeout: 60000 }, 3));
    var failed = [];
    function progress(done) { if (typeof onProgress === 'function') { try { onProgress({ done: done, total: goodsRows.length }); } catch (e) {} } }
    return Promise.all(metaJobs).then(function () {
      var batches = chunkGoodsRows(goodsRows, 400 * 1024);
      var done = 0; progress(0);
      return batches.reduce(function (chain, batch) {
        return chain.then(function () {
          return cloudReqRetry('cloud_goods', { method: 'POST', prefer: 'resolution=merge-duplicates', body: batch, timeout: 60000 }, 3)
            .then(function () { done += batch.length; progress(done); })
            .catch(function (e) {
              batch.forEach(function (r) { failed.push({ id: r.id, name: r.name, err: (e && e.message) || '网络异常' }); });
              done += batch.length; progress(done);
            });
        });
      }, Promise.resolve());
    }).then(function () {
      if (failed.length) {
        var f = failed[0];
        throw new Error('有 ' + failed.length + ' 件物品未上传成功（如「' + f.name + '」' + (f.err ? '：' + f.err : '') + '）。请换到更稳定的网络（或切换 WiFi/手机热点）后再点一次发布，已成功的物品不会重复');
      }
      return { goods: goodsRows.length, cats: catRows.length, bulls: bullRows.length, batches: chunkGoodsRows(goodsRows, 400 * 1024).length };
    });
  }
  function onCloudSync(fn) { cloudSyncWaiters.push(fn); }

  return {
    boot: boot, onReady: onReady, get: get, save: save, flushNow: flushNow,
    flushIfDirty: flushIfDirty, isDirty: isDirty, reload: reloadFromDisk, onExternalReload: onExternalReload,
    imgSrc: imgSrc, imgExists: imgExists, putImage: putImage, removeImage: removeImage,
    imgKeyOf: imgKeyOf, isPointer: isPointer, compressImage: compressImage, recompress: recompress,
    exportBundle: exportBundle, importBundle: importBundle,
    collectGarbage: collectGarbage, usage: usage, estimateQuota: estimateQuota,
    idbGetAll: idbGetAll, S_BAK: S_BAK, S_IMG: S_IMG, idbDel: idbDel,
    onSaveError: function (fn) { saveErrorHandler = fn; },
    isBooted: function () { return booted; }, getMode: function () { return mode; },
    // 云端共享
    cloudPull: cloudPull, onCloudSync: onCloudSync, cloudPublishAll: cloudPublishAll,
    cloudUpsertGoods: cloudUpsertGoods, cloudDeleteGoods: cloudDeleteGoods,
    cloudUpsertCat: cloudUpsertCat, cloudDeleteCat: cloudDeleteCat,
    cloudUpsertBulletin: cloudUpsertBulletin, cloudDeleteBulletin: cloudDeleteBulletin,
    lastCloudPullAt: function () { return lastCloudPullAt; }
  };
})();

var SUPABASE_URL='https://sfozgzaopzvxrsxbfyla.supabase.co';
var SUPABASE_ANON_KEY='sb_publishable_H9gYwPXXuKQVpH6Q8XCnRw_yZ1dyaPp';
var SUPABASE_ENABLED = SUPABASE_URL && SUPABASE_ANON_KEY;
function supabaseRequest(table, method, body, query){
  if(!SUPABASE_ENABLED) return Promise.reject(new Error('Supabase未配置'));
  var url=SUPABASE_URL+'/rest/v1/'+table;
  if(query) url+='?'+query;
  return new Promise(function(resolve,reject){
    var xhr=new XMLHttpRequest();
    xhr.open(method,url,true);
    xhr.setRequestHeader('apikey',SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Content-Type','application/json');
    xhr.setRequestHeader('Prefer','return=representation');
    xhr.onload=function(){
      if(xhr.status>=200&&xhr.status<300){
        try{resolve(JSON.parse(xhr.responseText));}catch(e){resolve(xhr.responseText);}
      }else{
        reject(new Error('Supabase请求失败:'+xhr.status+' '+xhr.responseText));
      }
    };
    xhr.onerror=function(){reject(new Error('Supabase网络错误'));};
    xhr.send(body?JSON.stringify(body):null);
  });
}

    html+='<div class="order-card" onclick="openOd(\''+order.orderNo+'\')"><div class="order-card-head"><span class="order-no">'+order.orderNo+'</span><span class="order-status '+statusClass+'">'+statusText+'</span></div><div class="order-items">'+itemsHtml+'</div><div class="order-total-row"><span class="order-total-label">合计</span><span class="order-total-val">'+order.total+'</span></div><div class="order-meta">'+order.createTime+' · 共'+count+'件</div></div>';
  });
  body.innerHTML=html;
}
function openOd(orderNo){
  var db=Store.get(); var order=db.orders.find(function(o){return o.orderNo===orderNo;}); if(!order)return;
  document.getElementById('odSub').innerText=order.orderNo+' · '+order.createTime; var body=document.getElementById('odBody');
  var statusText=order.status==='done'?'已处理':'待处理'; var statusColor=order.status==='done'?'var(--success)':'var(--warning)';
  var itemsHtml='<div class="od-section"><div class="od-section-title">物品明细</div>';
  order.items.forEach(function(it){
    var g=getGoodsById(it.goodsId)||getGoodsByName(it.goodsName); var grad=g?getGrad(g.catId):'grad-0';
    var src=goodsImg(g);
    itemsHtml+='<div class="od-item"><div class="od-item-img '+grad+'">';
    if(src){ itemsHtml+='<img src="'+src+'" alt="" decoding="async" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'; }
    itemsHtml+='<div class="fallback" style="display:'+(src?'none':'flex')+';">'+it.goodsName+'</div></div>';
    itemsHtml+='<div class="od-item-info"><div class="od-item-name">'+it.goodsName+'</div><div class="od-item-code">×'+it.qty+(it.code?' · '+it.code:'')+'</div></div><div class="od-item-sub">'+it.sub+'</div></div>';
  });
  itemsHtml+='<div class="od-total-row"><span>合计</span><span class="od-total-val">'+order.total+'</span></div></div>';
  var infoHtml='<div class="od-section"><div class="od-section-title">联系信息</div><div class="od-info-row"><span class="od-info-label">👤 姓名</span><span class="od-info-value">'+(order.userName||'-')+'</span></div><div class="od-info-row"><span class="od-info-label">📞 电话</span><span class="od-info-value">'+(order.userPhone||'-')+'</span></div><div class="od-info-row"><span class="od-info-label">📍 地址</span><span class="od-info-value">'+(order.userAddr||'-')+'</span></div>'+(order.note?'<div class="od-info-row"><span class="od-info-label">📝 备注</span><span class="od-info-value">'+order.note+'</span></div>':'')+'<div class="od-info-row"><span class="od-info-label">🕐 时间</span><span class="od-info-value">'+order.createTime+'</span></div></div>';
  var statusHtml='<div class="od-section"><div class="od-section-title">订单状态</div><div class="od-info-row"><span class="od-info-label">当前状态</span><span class="od-info-value" style="color:'+statusColor+';font-weight:600;">'+statusText+'</span></div></div>';
  body.innerHTML=itemsHtml+infoHtml+statusHtml; document.getElementById('odPage').classList.add('show');
}
function closeOd(){ document.getElementById('odPage').classList.remove('show'); }
function initFabDrag(){
  var btn=document.getElementById('fab'); if(!btn)return; var dragging=false,moved=false,sx,sy,sl,st;
  function start(e){ var t=e.touches?e.touches[0]:e; sx=t.clientX; sy=t.clientY; var r=btn.getBoundingClientRect(); sl=r.left; st=r.top; dragging=true; moved=false; }
  function move(e){
    if(!dragging)return; var t=e.touches?e.touches[0]:e; var dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>5||Math.abs(dy)>5){ moved=true; if(e.cancelable)e.preventDefault(); }
    var app=document.getElementById('app'); var ar=app.getBoundingClientRect(); var nl=sl+dx,nt=st+dy;
    var maxL=ar.right-btn.offsetWidth-8; var maxT=window.innerHeight-btn.offsetHeight-8;
    nl=Math.max(ar.left+8,Math.min(nl,maxL)); nt=Math.max(8,Math.min(nt,maxT));
    btn.style.left=nl+'px'; btn.style.top=nt+'px'; btn.style.right='auto'; btn.style.bottom='auto';
  }
  function end(){ if(!dragging)return; dragging=false; if(moved){ var r=btn.getBoundingClientRect(); localStorage.setItem('fab_pos',JSON.stringify({left:r.left,top:r.top})); setTimeout(function(){moved=false;},100); } }
  btn.addEventListener('mousedown',start); document.addEventListener('mousemove',move); document.addEventListener('mouseup',end);
  btn.addEventListener('touchstart',start,{passive:false}); document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',end);
  var saved=localStorage.getItem('fab_pos');
  if(saved){ try{ var p=JSON.parse(saved); btn.style.left=p.left+'px'; btn.style.top=p.top+'px'; btn.style.right='auto'; btn.style.bottom='auto'; }catch(e){} }
  btn.addEventListener('click',function(e){ if(moved){ e.stopPropagation(); e.preventDefault(); } },true);
}
var selectedReportType=null;
function openReport(){ document.getElementById('reportMask').classList.add('show'); }
function closeReport(){ document.getElementById('reportMask').classList.remove('show'); selectedReportType=null; var types=document.querySelectorAll('.report-type'); types.forEach(function(t){t.classList.remove('active');}); document.getElementById('reportContent').value=''; }
function selectReportType(el,type){ selectedReportType=type; var types=document.querySelectorAll('.report-type'); types.forEach(function(t){t.classList.remove('active');}); el.classList.add('active'); }
function submitReport(){
  if(!selectedReportType){ showToast('请选择举报类型'); return; }
  var reportType=selectedReportType; var content=document.getElementById('reportContent').value.trim();
  var db=Store.get(); var now=new Date(); var timeStr=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
  var reportId='rpt_'+Date.now(); var report={id:reportId,deviceId:deviceId,type:reportType,content:content,time:timeStr,status:'pending'};
  db.reports.unshift(report); persist(function(){}); closeReport(); showToast('举报已提交，感谢您的反馈');
  if(SUPABASE_ENABLED){ var cloudReport={id:reportId,device_id:deviceId,type:reportType,content:content,time:timeStr,status:'pending'}; insertReportToSupabase(cloudReport).catch(function(e){ console.warn('Supabase举报同步失败:',e); }); }
}
function checkBanned(){
  var db=Store.get();
  var localBanned=db.bannedDevices.find(function(d){return d.deviceId===deviceId;});
  if(SUPABASE_ENABLED){
    fetchBannedFromSupabase().then(function(list){
      var found=list.find(function(d){return d.device_id===deviceId;});
      if(found){
        showBannedPage({deviceId:found.device_id,reason:found.reason,time:found.time});
        if(!localBanned){ db.bannedDevices.push({deviceId:found.device_id,reason:found.reason,time:found.time}); Store.save(); Store.flushNow().catch(function(){}); }
      } else {
        if(localBanned){ db.bannedDevices=db.bannedDevices.filter(function(d){return d.deviceId!==deviceId;}); Store.save(); Store.flushNow().catch(function(){}); }
        var page=document.getElementById('bannedPage'); if(page) page.classList.remove('show');
      }
    }).catch(function(e){ console.warn('Supabase封禁检查失败:',e); if(localBanned) showBannedPage(localBanned); });
  } else { if(localBanned){ showBannedPage(localBanned); return true; } }
  return false;
}
function showBannedPage(banned){ var page=document.getElementById('bannedPage'); page.classList.add('show'); if(banned&&banned.time){ document.getElementById('bannedTime').innerText=banned.time; } else { var now=new Date(); document.getElementById('bannedTime').innerText=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate(); } }

/* 切后台/离开页面前兜底落盘：只在本页确有未落盘修改时写，
   防止 bfcache 冻结的旧页面用旧内存覆盖后台/其他页面刚写入的新数据（手机返回键"撤回"问题）*/
function safeFlush(){ try{ Store.flushIfDirty && Store.flushIfDirty(); }catch(e){} }
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden'){ safeFlush(); } });
window.addEventListener('pagehide',safeFlush);
/* 其他页面写入 / 手机侧键从 bfcache 返回时，丢弃冻结旧内存、按磁盘最新数据重渲染 */
Store.onExternalReload(function(){
  try{
    renderBarrage&&renderBarrage(); renderCats&&renderCats(); renderGoods&&renderGoods();
    typeof refreshBadge==='function'&&refreshBadge();
  }catch(e){ console.warn('外部同步重渲染失败',e); }
});
/* 云端权威数据到达（管理员后台增删改后）：所有客户设备用最新商品重渲染 */
Store.onCloudSync(function(){
  try{
    renderBarrage&&renderBarrage(); renderCats&&renderCats(); renderGoods&&renderGoods();
    typeof refreshBadge==='function'&&refreshBadge();
  }catch(e){ console.warn('云端同步重渲染失败',e); }
});
/* 客户切回前台时节流拉取云端最新（15 秒内不重复拉），保证看到管理员最新发布 */
var __lastVisiblePull=0;
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){
    var now=Date.now();
    if(now-__lastVisiblePull>15000){ __lastVisiblePull=now; try{ Store.cloudPull&&Store.cloudPull(); }catch(e){} }
  }
});

/* 启动门控：Store 完成 IDB 预热与迁移自愈后再渲染，杜绝时序丢图 */
Store.boot().then(function(){ init(); }).catch(function(err){
  console.error(err);
  // 即使 boot 抛错也尝试用现有数据渲染，遮罩必须撤掉，不能卡死用户
  try{ init(); }catch(e){
    var l0=document.getElementById('bootLoading');
    if(l0)l0.innerHTML='<p style="color:#f56c6c;padding:0 24px;text-align:center;">加载异常，请刷新重试</p>';
  }
});
/* 应用层看门狗：8 秒后遮罩若仍在，强制兜底，任何异常都不允许卡在加载页 */
setTimeout(function(){
  var l=document.getElementById('bootLoading');
  if(l && l.style.display!=='none'){
    try{ if(Store.isBooted()){ init(); } else { l.style.display='none'; } }catch(e){ l.style.display='none'; }
  }
},8000);
</script>
