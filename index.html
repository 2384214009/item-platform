<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>物品展示选择平台</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        :root{
            --primary:#2eb4a8;
            --primary-dark:#1a8a7f;
            --primary-light:#e8f8f6;
            --bg:#f4f8f8;
            --card:#ffffff;
            --text:#2d3436;
            --text-secondary:#6b7c80;
            --text-muted:#a0b0b3;
            --border:#e4ecec;
            --danger:#e74c3c;
            --warn:#f39c12;
            --radius-sm:10px;
            --radius-md:16px;
            --radius-lg:24px;
            --shadow-sm:0 1px 4px rgba(0,0,0,0.04);
            --shadow-md:0 4px 14px rgba(0,0,0,0.06);
            --shadow-lg:0 8px 28px rgba(0,0,0,0.1);
        }
        html,body{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background:var(--bg);
            color:var(--text);
            -webkit-font-smoothing:antialiased;
            -webkit-tap-highlight-color:transparent;
        }
        body{padding:12px;padding-bottom:90px;max-width:520px;margin:0 auto;min-height:100vh;}
        /* 公告条 */
        .barrage-wrap{
            overflow:hidden;
            background:linear-gradient(135deg,#e8f8f6,#d4f0ed);
            color:#0a6e66;
            padding:10px 36px 10px 14px;
            position:relative;
            border-radius:var(--radius-md);
            margin-bottom:14px;
            border:1px solid #b8e4df;
        }
        .barrage-text{white-space:nowrap;animation:scrollMove 20s linear infinite;font-size:13px;font-weight:500;}
        @keyframes scrollMove{from{transform:translateX(100%);}to{transform:translateX(-100%);}}
        .barrage-close{
            position:absolute;right:8px;top:50%;transform:translateY(-50%);
            border:none;background:rgba(255,255,255,0.6);font-size:14px;cursor:pointer;
            width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            color:#0a6e66;transition:background 0.2s;
        }
        .barrage-close:hover{background:#fff;}
        /* 头部 */
        header{text-align:left;padding:16px 4px 14px;margin-bottom:14px;}
        h1{
            color:var(--primary);font-size:26px;margin-bottom:6px;font-weight:700;
            letter-spacing:1px;
        }
        .desc{font-size:14px;color:var(--text-secondary);}
        /* 搜索框 */
        .search-wrap{
            position:relative;margin-bottom:16px;
        }
        .search-icon{
            position:absolute;left:16px;top:50%;transform:translateY(-50%);
            font-size:18px;color:var(--text-muted);pointer-events:none;
        }
        .search-box{
            width:100%;padding:14px 16px 14px 44px;border:1.5px solid var(--border);
            border-radius:var(--radius-lg);font-size:15px;
            background:var(--card);transition:border-color 0.2s,box-shadow 0.2s;
            outline:none;
        }
        .search-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,180,168,0.12);}
        /* 分类 */
        .category-scroll{
            display:flex;gap:10px;overflow-x:auto;padding:2px 0 14px;
            scrollbar-width:none;-ms-overflow-style:none;
        }
        .category-scroll::-webkit-scrollbar{display:none;}
        .cat-item{
            white-space:nowrap;padding:10px 22px;background:var(--card);
            border-radius:24px;font-size:15px;flex-shrink:0;cursor:pointer;
            border:1.5px solid var(--border);color:var(--text-secondary);font-weight:500;
            transition:all 0.2s;
        }
        .cat-item:hover{border-color:var(--primary);color:var(--primary);}
        .cat-item.active{
            background:var(--primary);
            color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(46,180,168,0.25);
        }
        /* 商品列表 */
        .goods-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
        .goods-card{
            background:var(--card);border-radius:var(--radius-lg);overflow:hidden;
            box-shadow:var(--shadow-sm);position:relative;transition:transform 0.2s,box-shadow 0.2s;
            cursor:pointer;
        }
        .goods-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
        .goods-card:active{transform:scale(0.98);}
        .sellout-tag{
            position:absolute;top:10px;right:10px;background:var(--danger);color:#fff;
            font-size:11px;padding:4px 10px;border-radius:14px;font-weight:600;z-index:2;
            box-shadow:0 2px 6px rgba(231,76,60,0.3);
        }
        .goods-img-wrap{
            width:100%;height:160px;background:#fff;
            overflow:hidden;border-radius:var(--radius-lg) var(--radius-lg) 0 0;
        }
        .goods-img{
            width:100%;height:100%;object-fit:cover;display:block;
        }
        .goods-img.sellout{opacity:0.4;filter:grayscale(0.6);}
        .goods-info{padding:12px 14px 14px;}
        .goods-name{font-weight:700;font-size:17px;margin-bottom:6px;color:var(--text);line-height:1.3;}
        .goods-code{font-size:13px;color:var(--text-secondary);margin-bottom:10px;font-weight:500;}
        .goods-code b{color:var(--text);font-weight:700;font-size:15px;margin-left:2px;}
        .cart-add{
            width:100%;padding:11px;border:none;border-radius:var(--radius-md);
            font-size:15px;background:var(--primary);color:#fff;
            font-weight:600;cursor:pointer;transition:all 0.2s;
        }
        .cart-add:hover{background:var(--primary-dark);}
        .cart-add:active{transform:scale(0.97);}
        .btn-disabled{
            background:#e8e8e8 !important;color:#aaa !important;cursor:not-allowed !important;
        }
        .btn-disabled:hover{background:#e8e8e8 !important;color:#aaa !important;}
        /* 空状态 */
        .empty-state{
            grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--text-muted);
        }
        .empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:0.5;}
        .empty-state .empty-text{font-size:14px;}
        /* 浮动按钮 */
        .cart-float{
            position:fixed;bottom:90px;right:calc(50% - 260px + 16px);
            width:58px;height:58px;border-radius:50%;
            background:var(--primary);
            color:#fff;display:flex;align-items:center;justify-content:center;
            font-size:26px;box-shadow:var(--shadow-lg);
            z-index:50;cursor:grab;transition:transform 0.15s,box-shadow 0.25s;
            border:none;touch-action:none;user-select:none;-webkit-user-select:none;
        }
        .cart-float:hover{transform:scale(1.08);box-shadow:0 12px 28px rgba(46,180,168,0.4);}
        .cart-float:active{cursor:grabbing;}
        .cart-float.dragging{transition:none;transform:scale(1.12);box-shadow:0 12px 32px rgba(46,180,168,0.55);z-index:999;}
        .cart-badge{
            position:absolute;top:-3px;right:-3px;
            background:var(--danger);min-width:20px;height:20px;
            border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;
            font-weight:700;border:2px solid #fff;
        }
        /* 购物车弹窗 */
        .cart-modal{
            position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;z-index:99;
            backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
        }
        .cart-modal.show{display:block;animation:fadeIn 0.2s ease;}
        .cart-panel{
            position:absolute;bottom:0;left:50%;transform:translateX(-50%);
            background:var(--card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
            max-height:75vh;display:flex;flex-direction:column;width:100%;max-width:520px;
            animation:slideUp 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        @keyframes slideUp{from{transform:translateX(-50%) translateY(100%);}to{transform:translateX(-50%) translateY(0);}}
        .cart-head{
            padding:16px 18px;border-bottom:1px solid var(--border);
            display:flex;justify-content:space-between;align-items:center;
        }
        .cart-head h3{font-size:17px;font-weight:700;}
        .cart-head button{
            border:none;background:var(--bg);color:var(--text-secondary);
            padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;
            transition:background 0.2s;
        }
        .cart-head button:hover{background:var(--border);}
        .cart-body{flex:1;overflow-y:auto;padding:8px 18px;}
        .cart-foot{padding:14px 18px;border-top:1px solid var(--border);background:#fafcfc;}
        .cart-foot > div{font-size:15px;margin-bottom:10px;color:var(--text-secondary);}
        .cart-foot > div b{color:var(--primary);font-size:20px;font-weight:700;}
        .cart-item{
            display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f3f6f6;align-items:center;
        }
        .cart-item:last-child{border-bottom:none;}
        .cart-item img{width:56px;height:56px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;}
        .cart-item > div:nth-child(2){flex:1;min-width:0;}
        .cart-item > div:nth-child(2) > div:first-child{font-weight:600;font-size:14px;margin-bottom:2px;}
        .cart-item > div:nth-child(2) > div:nth-child(2){color:var(--primary);font-weight:600;font-size:14px;margin-bottom:6px;}
        .cart-qty{display:flex;gap:6px;align-items:center;}
        .cart-qty button{
            width:26px;height:26px;border-radius:6px;border:1px solid var(--border);
            background:#f7f9f9;font-size:14px;cursor:pointer;display:flex;align-items:center;
            justify-content:center;transition:all 0.15s;color:var(--text);
        }
        .cart-qty button:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}
        .cart-qty button:disabled{opacity:0.4;cursor:not-allowed;}
        .cart-qty span{min-width:24px;text-align:center;font-weight:600;font-size:14px;}
        .cart-qty .remove-btn{
            width:auto;padding:0 10px;font-size:12px;color:var(--danger);
            border-color:#f5d5d2;background:#fdf5f4;margin-left:4px;
        }
        .cart-qty .remove-btn:hover{border-color:var(--danger);color:var(--danger);}
        .cart-item > div:last-child{font-weight:700;font-size:14px;color:var(--text);flex-shrink:0;}
        .submit-order{
            width:100%;padding:13px;border:none;border-radius:var(--radius-md);
            background:var(--primary);
            color:#fff;font-size:15px;font-weight:600;cursor:pointer;
            transition:transform 0.15s,box-shadow 0.2s;
            box-shadow:0 4px 12px rgba(46,180,168,0.3);
        }
        .submit-order:hover{background:var(--primary-dark);}
        .submit-order:active{transform:scale(0.98);}
        /* 订单弹窗 */
        .order-modal{
            position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;
            align-items:center;justify-content:center;padding:14px;z-index:100;
            backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
        }
        .order-modal.show{display:flex;animation:fadeIn 0.2s ease;}
        .modal-box{
            background:var(--card);width:100%;max-width:420px;border-radius:var(--radius-lg);
            padding:22px;max-height:85vh;overflow-y:auto;
            animation:popIn 0.3s cubic-bezier(0.16,1,0.3,1);
            box-shadow:var(--shadow-lg);
        }
        @keyframes popIn{from{opacity:0;transform:scale(0.92);}to{opacity:1;transform:scale(1);}}
        .modal-box h3{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center;}
        .modal-box #orderListShow{
            background:var(--bg);border-radius:var(--radius-sm);padding:12px;
            margin-bottom:14px;font-size:13px;line-height:1.8;
        }
        .modal-box #orderListShow > div{display:flex;justify-content:space-between;}
        .modal-box > div:nth-of-type(2){
            font-size:15px;margin-bottom:14px;padding-top:10px;
            border-top:1px dashed var(--border);display:flex;justify-content:space-between;
            align-items:center;
        }
        .modal-box > div:nth-of-type(2) b{color:var(--primary);font-size:18px;font-weight:700;}
        input,textarea{
            width:100%;padding:12px 14px;margin:6px 0;border:1.5px solid var(--border);
            border-radius:var(--radius-sm);font-size:14px;background:var(--card);
            transition:border-color 0.2s,box-shadow 0.2s;outline:none;font-family:inherit;
        }
        input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,180,168,0.12);}
        textarea{resize:vertical;min-height:60px;}
        /* 商品详情页 - 全屏页面 */
        .detail-modal{
            position:fixed;inset:0;background:var(--bg);display:none;
            z-index:101;overflow-y:auto;
        }
        .detail-modal.show{display:block;animation:slideInRight 0.3s ease;}
        @keyframes slideInRight{from{transform:translateX(100%);}to{transform:translateX(0);}}
        .detail-hero{
            width:100%;height:280px;position:relative;overflow:hidden;
            background:#f0f0f0;
        }
        .detail-hero img{width:100%;height:100%;object-fit:cover;display:block;}
        .detail-back{
            position:absolute;top:16px;left:16px;width:40px;height:40px;
            border-radius:50%;background:rgba(255,255,255,0.9);border:none;
            font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
            color:var(--text);z-index:2;transition:background 0.2s;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }
        .detail-back:hover{background:#fff;}
        .detail-content{
            background:var(--bg);padding:20px 16px 140px;max-width:520px;margin:0 auto;
        }
        .detail-code-text{font-size:14px;color:var(--text-secondary);margin-bottom:8px;font-weight:500;}
        .detail-code-text b{color:var(--text);font-weight:700;font-size:16px;margin-left:2px;}
        .detail-title{font-size:26px;font-weight:700;margin-bottom:10px;color:var(--text);}
        .detail-cat-tag{
            display:inline-block;padding:4px 12px;background:var(--primary-light);
            color:var(--primary-dark);border-radius:14px;font-size:13px;font-weight:500;
            margin-bottom:14px;
        }
        .detail-desc-text{font-size:15px;color:var(--text-secondary);line-height:1.6;margin-bottom:20px;}
        .detail-qty-card{
            background:var(--card);border-radius:var(--radius-lg);padding:16px 18px;
            display:flex;justify-content:space-between;align-items:center;
            box-shadow:var(--shadow-sm);margin-bottom:20px;
        }
        .detail-qty-label{font-size:16px;font-weight:600;color:var(--text);}
        .detail-qty-control{display:flex;align-items:center;gap:20px;}
        .qty-btn{
            width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
            display:flex;align-items:center;justify-content:center;font-size:20px;
            transition:all 0.15s;
        }
        .qty-btn.minus{background:#f0f0f0;color:var(--text);}
        .qty-btn.minus:hover{background:#e0e0e0;}
        .qty-btn.plus{background:var(--primary);color:#fff;}
        .qty-btn.plus:hover{background:var(--primary-dark);}
        .qty-btn:disabled{opacity:0.4;cursor:not-allowed;}
        .qty-num{font-size:20px;font-weight:700;min-width:30px;text-align:center;}
        .detail-bottom-bar{
            position:fixed;bottom:0;left:50%;transform:translateX(-50%);
            width:100%;max-width:520px;background:#fff;padding:12px 16px;
            display:flex;gap:12px;border-top:1px solid var(--border);
            padding-bottom:calc(12px + env(safe-area-inset-bottom));
            z-index:102;
        }
        .detail-btn-outline{
            flex:1;padding:14px;border:2px solid var(--primary);background:#fff;
            color:var(--primary);border-radius:var(--radius-md);font-size:16px;
            font-weight:600;cursor:pointer;transition:all 0.15s;
        }
        .detail-btn-outline:hover{background:var(--primary-light);}
        .detail-btn-outline:active{transform:scale(0.98);}
        .detail-btn-solid{
            flex:1;padding:14px;border:none;background:var(--primary);
            color:#fff;border-radius:var(--radius-md);font-size:16px;
            font-weight:600;cursor:pointer;transition:all 0.15s;
        }
        .detail-btn-solid:hover{background:var(--primary-dark);}
        .detail-btn-solid:active{transform:scale(0.98);}
        /* 底部导航 - 飞书版简洁风格 */
        .nav-bottom{
            position:fixed;bottom:0;left:50%;transform:translateX(-50%);
            background:#ffffff;
            display:flex;border-top:1px solid #f0f0f0;z-index:10;
            width:100%;max-width:520px;
            padding-bottom:env(safe-area-inset-bottom);
        }
        .nav-bottom button{
            flex:1;padding:10px 0 12px;border:none;background:transparent;
            font-size:12px;color:var(--text-muted);cursor:pointer;
            display:flex;flex-direction:column;align-items:center;gap:4px;
            transition:color 0.2s;font-family:inherit;
        }
        .nav-bottom button .nav-icon{font-size:22px;line-height:1;}
        .nav-bottom button:hover{color:var(--primary);}
        .nav-bottom button.active{color:var(--primary);font-weight:600;}
        /* 我的记录页面 - 飞书版风格 */
        .myrecord-modal{
            position:fixed;inset:0;background:var(--bg);z-index:150;
            display:none;overflow-y:auto;
        }
        .myrecord-modal.show{display:block;animation:slideInRight 0.3s ease;}
        .myrecord-header{
            padding:20px 16px 16px 64px;max-width:560px;margin:0 auto;
            position:relative;
        }
        .myrecord-title{
            font-size:28px;font-weight:800;color:var(--primary);
            margin-bottom:4px;
        }
        .myrecord-subtitle{
            font-size:14px;color:var(--text-muted);
        }
        .myrecord-list{
            max-width:560px;margin:0 auto;padding:0 16px 100px;
        }
        .myrecord-card{
            background:var(--card);border-radius:20px;padding:16px;
            margin-bottom:14px;box-shadow:var(--shadow-sm);
            display:flex;align-items:center;gap:12px;cursor:pointer;
            transition:all 0.15s;border:1px solid var(--border);
        }
        .myrecord-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
        .myrecord-card:active{transform:scale(0.98);}
        .myrecord-card-left{flex:1;min-width:0;}
        .myrecord-card-no{
            font-size:16px;font-weight:700;color:var(--text);
            margin-bottom:6px;display:flex;align-items:center;gap:8px;
        }
        .myrecord-status{
            padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;
            flex-shrink:0;
        }
        .myrecord-status.pending{background:#fff3e0;color:#e65100;}
        .myrecord-status.done{background:#e8f5e9;color:#2e7d32;}
        .myrecord-card-time{
            font-size:13px;color:var(--text-muted);margin-bottom:4px;
        }
        .myrecord-card-count{
            font-size:13px;color:var(--text-secondary);
        }
        .myrecord-card-right{
            display:flex;flex-direction:column;align-items:flex-end;gap:6px;
            flex-shrink:0;
        }
        .myrecord-card-imgs{
            position:relative;width:60px;height:60px;
        }
        .myrecord-card-img{
            width:60px;height:60px;border-radius:14px;object-fit:cover;
            position:absolute;top:0;right:0;border:2px solid var(--card);
        }
        .myrecord-card-img:nth-child(2){right:12px;top:4px;z-index:-1;opacity:0.8;}
        .myrecord-card-img:nth-child(3){right:24px;top:8px;z-index:-2;opacity:0.6;}
        .myrecord-card-img-badge{
            position:absolute;bottom:-4px;right:-4px;
            background:var(--primary);color:#fff;font-size:11px;font-weight:700;
            width:22px;height:22px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            border:2px solid var(--card);
        }
        .myrecord-card-total{
            font-size:18px;font-weight:800;color:var(--primary);
        }
        .myrecord-card-arrow{
            color:var(--text-muted);font-size:18px;
        }
        .myrecord-empty{
            text-align:center;padding:60px 20px;color:var(--text-muted);
        }
        .myrecord-empty-icon{
            font-size:48px;margin-bottom:12px;opacity:0.5;
        }
        /* 我的记录详情页 - 飞书版风格 */
        .myrecord-detail-modal{
            position:fixed;inset:0;background:var(--bg);z-index:160;
            display:none;overflow-y:auto;
        }
        .myrecord-detail-modal.show{display:block;animation:slideInRight 0.3s ease;}
        .mr-detail-header{
            padding:16px;max-width:560px;margin:0 auto;
            display:flex;align-items:center;gap:12px;
            background:var(--bg);
        }
        .mr-detail-back{
            width:40px;height:40px;border-radius:50%;background:var(--card);
            border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
            box-shadow:var(--shadow-sm);flex-shrink:0;
        }
        .mr-detail-title{flex:1;min-width:0;}
        .mr-detail-no{
            font-size:16px;font-weight:700;color:var(--text);
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
        }
        .mr-detail-time{font-size:12px;color:var(--text-muted);margin-top:2px;}
        .mr-detail-status{
            padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;
            flex-shrink:0;
        }
        .mr-detail-status.pending{background:#fff3e0;color:#e65100;}
        .mr-detail-status.done{background:#e8f5e9;color:#2e7d32;}
        .mr-detail-content{
            max-width:560px;margin:0 auto;padding:0 16px 100px;
        }
        .mr-detail-card{
            background:var(--card);border-radius:20px;padding:16px;
            margin-bottom:14px;box-shadow:var(--shadow-sm);
        }

<script>
let deviceId = localStorage.getItem("device_uid");
if(!deviceId){
    deviceId = "dev_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    localStorage.setItem("device_uid",deviceId);
}
function getDb(){
    const raw = localStorage.getItem("shop_db");
    return raw ? JSON.parse(raw) : {
        goods:[
            {id:1,catId:"aixi",name:"酸奶",code:"No.23",price:18,desc:"经典酸奶口味，清爽顺滑，爱喜系列经典款",img:"https://images.unsplash.com/photo-1488477181946-6428a0291777?w=400",sellout:false},
            {id:2,catId:"aixi",name:"香芋",code:"No.23",price:18,desc:"浓郁香芋风味，绵密细腻，爱喜系列人气款",img:"https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=400",sellout:false},
            {id:3,catId:"aixi",name:"茉莉",code:"No.23",price:20,desc:"清新茉莉花香，回味悠长，爱喜系列高端款",img:"https://images.unsplash.com/photo-1564890369478-c89ca6d9cde9?w=400",sellout:false},
            {id:4,catId:"alishan",name:"天韵",code:"No.38",price:25,desc:"阿里山经典系列，口感醇厚，阿里山招牌款",img:"https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400",sellout:false},
            {id:5,catId:"alishan",name:"芒果",code:"No.38",price:22,desc:"热带芒果风味，果香四溢，阿里山果味系列",img:"https://images.unsplash.com/photo-1553279768-86542fa0078?w=400",sellout:false},
            {id:6,catId:"baile",name:"原味",code:"No.15",price:15,desc:"百乐经典原味，简约之选，百乐入门款",img:"https://images.unsplash.com/photo-1578913130218-2f66c2b3a1a0?w=400",sellout:false},
        ],
        orders:[],
        categories:[
            {id:"aixi",name:"爱喜"},
            {id:"alishan",name:"阿里山"},
            {id:"baile",name:"百乐"},
        ],
        adminAccounts:[{username:"2384214009",pwd:"13727733582q.",role:"super"},{username:"admin",pwd:"admin123",role:"normal"}],
        cart:[],
        bulletins:[{id:1,content:"欢迎使用物品展示平台 | 本平台仅用于信息登记，不提供任何交易服务",enable:true}],
    };
}
function saveDb(db){localStorage.setItem("shop_db",JSON.stringify(db));}
function renderBulletin(){
    const db = getDb();
    const wrap = document.getElementById("barrageWrap");
    const txtDom = document.getElementById("barrageText");
    const showClosed = sessionStorage.getItem("barrage_closed");
    const activeList = db.bulletins.filter(b=>b.enable===true);
    if(activeList.length===0 || showClosed==="1"){wrap.style.display="none";return;}
    wrap.style.display="block";
    txtDom.innerText = activeList.map(i=>i.content).join("　｜　");
}
function closeBarrage(){
    sessionStorage.setItem("barrage_closed","1");
    document.getElementById("barrageWrap").style.display="none";
}
let currentCat = "all";
let searchKey = "";
function renderCats(){
    const db = getDb();
    const wrap = document.getElementById("catScroll");
    wrap.innerHTML = `<div class="cat-item ${currentCat==='all'?'active':''}" onclick="switchCat('all')">全部</div>`;
    db.categories.forEach(c=>{
        wrap.innerHTML += `<div class="cat-item ${currentCat===c.id?'active':''}" onclick="switchCat('${c.id}')">${c.name}</div>`;
    });
}
function switchCat(cid){currentCat=cid;renderCats();renderGoods();}
function doSearch(){searchKey=document.getElementById("searchInput").value.trim().toLowerCase();renderGoods();}
function renderGoods(){
    const db = getDb();
    const wrap = document.getElementById("goodsList");
    wrap.innerHTML = "";
    let list = db.goods;
    if(currentCat!=='all') list = db.goods.filter(g=>g.catId===currentCat);
    if(searchKey) list = list.filter(g=>g.name.toLowerCase().includes(searchKey));
    if(list.length===0){
        wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">暂无相关物品</div></div>`;
        refreshCartBadge();
        return;
    }
    list.forEach(item=>{
        const isSellout = item.sellout===true;
        const card = document.createElement("div");
        card.className="goods-card";
        card.onclick = function(e){
            if(e.target.closest('.cart-add')) return;
            openDetail(item.id);
        };
        card.innerHTML=`
            ${isSellout?'<span class="sellout-tag">已无库存</span>':''}
            <div class="goods-img-wrap">
                <img class="goods-img ${isSellout?'sellout':''}" src="${item.img}" alt="${item.name}" loading="lazy">
            </div>
            <div class="goods-info">
                <div class="goods-name">${item.name}</div>
                ${item.code ? `<div class="goods-code">编号 <b>${item.code}</b></div>` : ''}
                <button class="cart-add ${isSellout?'btn-disabled':''}" onclick="event.stopPropagation();addToCart(${item.id})" ${isSellout?'disabled':''}>加入清单</button>
            </div>
        `;
        wrap.appendChild(card);
    });
    refreshCartBadge();
}
/* 商品详情 */
let currentDetailGoodsId=null;
let currentDetailQty=1;
function openDetail(goodsId){
    const db=getDb();
    const item=db.goods.find(g=>g.id===goodsId);
    if(!item) return;
    currentDetailGoodsId=goodsId;
    currentDetailQty=1;
    document.getElementById("detailImg").src=item.img;
    document.getElementById("detailImg").alt=item.name;
    document.getElementById("detailName").innerText=item.name;
    if(item.code){
        document.getElementById("detailCodeRow").style.display='block';
        document.getElementById("detailCode").innerText=item.code;
    }else{
        document.getElementById("detailCodeRow").style.display='none';
    }
    const cat=db.categories.find(c=>c.id===item.catId);
    document.getElementById("detailCatTag").innerText=cat?cat.name:'未分类';
    document.getElementById("detailDesc").innerText=item.desc&&item.desc.trim()?item.desc:'暂无描述';
    document.getElementById("detailQtyNum").innerText=currentDetailQty;
    document.getElementById("qtyMinusBtn").disabled=currentDetailQty<=1;
    const addBtn=document.getElementById("detailAddBtn");
    const submitBtn=document.getElementById("detailSubmitBtn");
    if(item.sellout){
        addBtn.innerText="已无库存";
        addBtn.classList.add("btn-disabled");
        addBtn.disabled=true;
        submitBtn.innerText="已无库存";
        submitBtn.classList.add("btn-disabled");
        submitBtn.disabled=true;
    }else{
        addBtn.innerText="加入清单";
        addBtn.classList.remove("btn-disabled");
        addBtn.disabled=false;
        addBtn.onclick=function(){
            for(let i=0;i<currentDetailQty;i++){addToCart(item.id);}
            alert(`已添加 ${currentDetailQty} 件到意向清单`);
            closeDetail();
        };
        submitBtn.innerText="提交登记";
        submitBtn.classList.remove("btn-disabled");
        submitBtn.disabled=false;
        submitBtn.onclick=function(){
            for(let i=0;i<currentDetailQty;i++){addToCart(item.id);}
            closeDetail();
            setTimeout(goCheckout,100);
        };
    }
    document.getElementById("detailModal").classList.add("show");
    document.body.style.overflow='hidden';
}
function detailQtyMinus(){
    if(currentDetailQty<=1) return;
    currentDetailQty--;
    document.getElementById("detailQtyNum").innerText=currentDetailQty;
    document.getElementById("qtyMinusBtn").disabled=currentDetailQty<=1;
}
function detailQtyPlus(){
    currentDetailQty++;
    document.getElementById("detailQtyNum").innerText=currentDetailQty;
    document.getElementById("qtyMinusBtn").disabled=false;
}
function closeDetail(){
    document.getElementById("detailModal").classList.remove("show");
    document.body.style.overflow='';
}
function getCart(){const raw=localStorage.getItem("shop_cart");return raw?JSON.parse(raw):[];}
function saveCart(arr){localStorage.setItem("shop_cart",JSON.stringify(arr));}
function addToCart(goodsId){
    const db=getDb();const goods=db.goods.find(g=>g.id===goodsId);
    if(goods.sellout) return alert("该物品已无库存");
    let cart=getCart();const idx=cart.findIndex(x=>x.gid===goodsId);
    if(idx>=0){cart[idx].qty+=1;}else{cart.push({gid:goodsId,qty:1});}
    saveCart(cart);refreshCartBadge();
}
function refreshCartBadge(){
    const cart=getCart();const total=cart.reduce((s,i)=>s+i.qty,0);
    document.getElementById("cartBadge").innerText=total;
}
function openCartModal(){
    const modal=document.getElementById("cartModal");
    modal.classList.add("show");modal.style.display="block";
    renderCartPanel();
}
function closeCartModal(){
    const modal=document.getElementById("cartModal");
    modal.classList.remove("show");
    setTimeout(()=>{modal.style.display="none";},200);
}
function renderCartPanel(){
    const db=getDb();const cart=getCart();
    const body=document.getElementById("cartBody");
    body.innerHTML="";
    if(cart.length===0){
        body.innerHTML=`<div class="empty-state"><div class="empty-icon">🛒</div><div class="empty-text">清单还是空的，快去添加物品吧</div></div>`;
        document.getElementById("cartTotal").innerText="¥0.00";
        return;
    }
    let total=0;
    cart.forEach(item=>{
        const g=db.goods.find(x=>x.id===item.gid);
        if(!g) return;
        const sellFlag=!!g.sellout;
        const subtotal=Number(g.price)*item.qty;
        total+=subtotal;
        body.innerHTML+=`
        <div class="cart-item">
            <img src="${g.img}" alt="${g.name}">
            <div style="flex:1;min-width:0">
                <div>${g.name} ${sellFlag?"【无库存】":""}</div>
                <div>¥${g.price}</div>
                <div class="cart-qty">
                    <button onclick="cartMinus(${item.gid})">-</button>
                    <span>${item.qty}</span>
                    <button onclick="cartPlus(${item.gid})" ${sellFlag?'disabled':''}>+</button>
                    <button class="remove-btn" onclick="cartDel(${item.gid})">移除</button>
                </div>
            </div>
            <div>¥${subtotal.toFixed(2)}</div>
        </div>
        `;
    });
    document.getElementById("cartTotal").innerText="¥"+total.toFixed(2);
}
function cartMinus(gid){
    let cart=getCart();const idx=cart.findIndex(i=>i.gid===gid);
    if(idx===-1) return;
    cart[idx].qty-=1;
    if(cart[idx].qty<=0) cart.splice(idx,1);
    saveCart(cart);renderCartPanel();refreshCartBadge();
}
function cartPlus(gid){
    const db=getDb();const g=db.goods.find(x=>x.id===gid);
    if(g&&g.sellout) return alert("该物品已无库存");
    let cart=getCart();const idx=cart.findIndex(i=>i.gid===gid);
    if(idx===-1) return;
    cart[idx].qty+=1;
    saveCart(cart);renderCartPanel();refreshCartBadge();
}
function cartDel(gid){
    let cart=getCart();cart=cart.filter(i=>i.gid!==gid);
    saveCart(cart);renderCartPanel();refreshCartBadge();
}
function goCheckout(){
    const cart=getCart();
    if(cart.length===0) return alert("清单还是空的，先添加物品吧");
    closeCartModal();
    const db=getDb();
    const listShow=document.getElementById("orderListShow");
    listShow.innerHTML="";
    let total=0;
    cart.forEach(item=>{
        const g=db.goods.find(x=>x.id===item.gid);
        if(!g) return;
        const subtotal=Number(g.price)*item.qty;
        total+=subtotal;
        listShow.innerHTML+=`<div><span>${g.name} ×${item.qty}</span><span>¥${subtotal.toFixed(2)}</span></div>`;
    });
    document.getElementById("orderTotalShow").innerText="¥"+total.toFixed(2);
    document.getElementById("orderModal").classList.add("show");
}
function submitAllOrder(){
    const name=document.getElementById("userName").value.trim();
    const phone=document.getElementById("userPhone").value.trim();
    const addr=document.getElementById("userAddr").value.trim();
    const note=document.getElementById("userNote").value.trim();
    if(!name) return alert("请填写姓名");
    if(!phone) return alert("请填写联系电话");
    const db=getDb();
    const cart=getCart();
    let total=0;
    const items=[];
    cart.forEach(item=>{
        const g=db.goods.find(x=>x.id===item.gid);
        if(!g) return;
        const subtotal=Number(g.price)*item.qty;
        total+=subtotal;
        items.push({goodsName:g.name,qty:item.qty,price:g.price,sub:subtotal});
    });
    const order={
        orderNo:"ord_"+Date.now(),
        deviceId:deviceId,
        userName:name,userPhone:phone,userAddr:addr,note:note,
        items:items,total:total,
        createTime:new Date().toLocaleString("zh-CN"),
        status:"pending"
    };
    db.orders.unshift(order);
    saveDb(db);
    saveCart([]);
    document.getElementById("orderModal").classList.remove("show");
    document.getElementById("userName").value="";
    document.getElementById("userPhone").value="";
    document.getElementById("userAddr").value="";
    document.getElementById("userNote").value="";
    refreshCartBadge();
    alert("提交成功！您的意向信息已登记，我们会尽快与您联系。");
}
function openMyOrder(){
    const db=getDb();
    const myOrders=db.orders.filter(o=>o.deviceId===deviceId);
    const listEl=document.getElementById("myrecordList");
    if(myOrders.length===0){
        listEl.innerHTML='<div class="myrecord-empty"><div class="myrecord-empty-icon">📋</div><div>您还没有提交过意向记录</div></div>';
    }else{
        let html="";
        myOrders.forEach((o,idx)=>{
            const createTime=o.createTime||o.createdAt||"未知时间";
            const status=o.status==="pending"?"待处理":(o.status==="done"?"已处理":(o.status||"未知"));
            const statusClass=o.status==="pending"?"pending":"done";
            const total=typeof o.total==="number"?o.total:(o.total||"0");
            const itemCount=o.items?o.items.length:0;
            // 商品图片（最多显示3张，叠加效果）
            let imgsHtml="";
            if(o.items&&o.items.length>0){
                const showItems=o.items.slice(0,3);
                showItems.forEach((it,i)=>{
                    const goods=db.goods.find(g=>g.name===(it.goodsName||it.name));
                    const imgSrc=goods?goods.img:"";
                    if(imgSrc){
                        imgsHtml+=`<img class="myrecord-card-img" src="${imgSrc}" alt="" style="z-index:${3-i}">`;
                    }
                });
                if(o.items.length>1){
                    imgsHtml+=`<div class="myrecord-card-img-badge">${o.items.length}</div>`;
                }
            }
            html+=`
            <div class="myrecord-card" onclick="showMyRecordDetail(${idx})">
                <div class="myrecord-card-left">
                    <div class="myrecord-card-no">${o.orderNo||o.id||"未知"} <span class="myrecord-status ${statusClass}">${status}</span></div>
                    <div class="myrecord-card-time">${createTime}</div>
                    <div class="myrecord-card-count">共 ${itemCount} 件物品</div>
                </div>
                <div class="myrecord-card-right">
                    <div class="myrecord-card-imgs">${imgsHtml}</div>
                    <div class="myrecord-card-total">合计 ${total}</div>
                </div>
                <div class="myrecord-card-arrow">›</div>
            </div>`;
        });
        listEl.innerHTML=html;
    }
    document.getElementById("myrecordModal").classList.add("show");
    document.body.style.overflow="hidden";

/* 浮动按钮拖拽 */
(function(){
    const btn=document.getElementById("cartFloatBtn");
    let isDragging=false;
    let startX,startY,startLeft,startTop;
    let moved=false;
    const savedPos=localStorage.getItem("cart_float_pos");
    if(savedPos){
        try{
            const pos=JSON.parse(savedPos);
            btn.style.left=pos.left+"px";
            btn.style.top=pos.top+"px";
            btn.style.right="auto";
            btn.style.bottom="auto";
        }catch(e){}
    }
    function getPos(e){
        if(e.touches&&e.touches.length>0) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
        return {x:e.clientX,y:e.clientY};
    }
    function onStart(e){
        isDragging=true;moved=false;
        const pos=getPos(e);
        startX=pos.x;startY=pos.y;
        const rect=btn.getBoundingClientRect();
        startLeft=rect.left;startTop=rect.top;
        btn.classList.add("dragging");
        e.preventDefault();
    }
    function onMove(e){
        if(!isDragging) return;
        const pos=getPos(e);
        const dx=pos.x-startX;
        const dy=pos.y-startY;
        if(Math.abs(dx)>5||Math.abs(dy)>5) moved=true;
        let newLeft=startLeft+dx;
        let newTop=startTop+dy;
        const maxLeft=window.innerWidth-btn.offsetWidth;
        const maxTop=window.innerHeight-btn.offsetHeight;
        newLeft=Math.max(0,Math.min(newLeft,maxLeft));
        newTop=Math.max(0,Math.min(newTop,maxTop));
        btn.style.left=newLeft+"px";
        btn.style.top=newTop+"px";
        btn.style.right="auto";
        btn.style.bottom="auto";
        e.preventDefault();
    }
    function onEnd(e){
        if(!isDragging) return;
        isDragging=false;
        btn.classList.remove("dragging");
        if(moved){
            const rect=btn.getBoundingClientRect();
            localStorage.setItem("cart_float_pos",JSON.stringify({left:rect.left,top:rect.top}));
        }else{
            openCartModal();
        }
    }
    btn.addEventListener("mousedown",onStart);
    document.addEventListener("mousemove",onMove);
    document.addEventListener("mouseup",onEnd);
    btn.addEventListener("touchstart",onStart,{passive:false});
    document.addEventListener("touchmove",onMove,{passive:false});
    document.addEventListener("touchend",onEnd);
})();
/* 数据迁移：旧字段名转新字段名，兼容历史订单 */
function migrateOrders(){
    const db=getDb();
    let changed=false;
    db.orders.forEach(o=>{
        if(o.id&&!o.orderNo){o.orderNo=o.id;delete o.id;changed=true;}
        if(o.name&&!o.userName){o.userName=o.name;delete o.name;changed=true;}
        if(o.phone&&!o.userPhone){o.userPhone=o.phone;delete o.phone;changed=true;}
        if(o.addr&&!o.userAddr){o.userAddr=o.addr;delete o.addr;changed=true;}
        if(o.createdAt&&!o.createTime){o.createTime=o.createdAt;delete o.createdAt;changed=true;}
        if(o.status==="待处理"){o.status="pending";changed=true;}
        if(o.items){
            o.items.forEach(it=>{
                if(it.name&&!it.goodsName){it.goodsName=it.name;delete it.name;changed=true;}
                if(it.subtotal!==undefined&&it.sub===undefined){it.sub=it.subtotal;delete it.subtotal;changed=true;}
            });
        }
    });
    if(changed) saveDb(db);
}
