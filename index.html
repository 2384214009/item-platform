<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>物品展示选择平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f5f9f8;color:#333;min-height:100vh;}
:root{--primary:#2eb4a8;--primary-dark:#1a8a7f;--primary-light:#e8f5f3;--bg:#f5f9f8;--card:#fff;--text:#333;--text2:#888;--text3:#bbb;--border:#eef2f1;--danger:#f56c6c;--warning:#e6a23c;--success:#67c23a;--radius:16px;--radius-sm:10px;--radius-btn:24px;}
.app{max-width:500px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:70px;}
.barrage{background:var(--primary-light);padding:10px 16px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;}
.barrage-icon{color:var(--primary);flex-shrink:0;font-size:14px;}
.barrage-text{flex:1;overflow:hidden;white-space:nowrap;position:relative;font-size:13px;color:var(--primary-dark);}
.barrage-scroll{display:inline-block;white-space:nowrap;animation:barrage 12s linear infinite;padding-left:100%;}
@keyframes barrage{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
.barrage-close{cursor:pointer;color:var(--text2);font-size:18px;line-height:1;padding:0 4px;flex-shrink:0;}
.header{padding:20px 16px 12px;}
.header h1{font-size:22px;font-weight:700;color:var(--primary);margin-bottom:4px;}
.header .sub{font-size:13px;color:var(--text2);}
.search-wrap{padding:0 16px 14px;}
.search-box{display:flex;align-items:center;background:#fff;border-radius:var(--radius-sm);padding:11px 14px;border:1px solid var(--border);}
.search-box svg{width:18px;height:18px;color:var(--text3);flex-shrink:0;}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:14px;margin-left:8px;color:var(--text);}
.cats{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cat{flex-shrink:0;padding:7px 18px;border-radius:20px;background:#fff;border:1px solid var(--border);font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s;}
.cat.active{background:var(--primary);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(46,180,168,.25);}
.goods-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 20px;}
.goods-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);cursor:pointer;transition:transform .15s;position:relative;}
.goods-card:active{transform:scale(.98);}
.goods-img{width:100%;aspect-ratio:1/1;overflow:hidden;position:relative;background:#f0f0f0;}
.goods-img img{width:100%;height:100%;object-fit:cover;display:block;}
.goods-img .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;text-align:center;padding:8px;position:absolute;top:0;left:0;}
.sellout-tag{position:absolute;top:8px;right:8px;background:rgba(245,108,108,.9);color:#fff;font-size:11px;padding:3px 8px;border-radius:4px;z-index:2;}
.goods-info{padding:10px 12px 12px;}
.goods-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.goods-code{font-size:12px;color:var(--text2);margin-bottom:10px;}
.goods-btn{width:100%;padding:8px 0;border-radius:var(--radius-btn);font-size:13px;font-weight:600;cursor:pointer;border:none;text-align:center;}
.goods-btn.active{background:var(--primary);color:#fff;}
.goods-btn.disabled{background:#f0f0f0;color:var(--text3);cursor:not-allowed;}
.grad-1{background:linear-gradient(135deg,#667eea,#764ba2)!important;}
.grad-2{background:linear-gradient(135deg,#f093fb,#f5576c)!important;}
.grad-3{background:linear-gradient(135deg,#4facfe,#00f2fe)!important;}
.grad-0{background:linear-gradient(135deg,#a8edea,#fed6e3)!important;}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;}
.empty-icon{font-size:42px;margin-bottom:12px;opacity:.5;}
.empty-text{font-size:14px;color:var(--text2);}
.empty-link{color:var(--primary);font-size:13px;margin-top:8px;cursor:pointer;display:inline-block;}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#fff;display:flex;justify-content:space-around;align-items:center;padding:8px 0 12px;box-shadow:0 -2px 12px rgba(0,0,0,.05);z-index:100;}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);font-size:11px;flex:1;}
.tab-item svg{width:22px;height:22px;}
.tab-item.active{color:var(--primary);}
.fab{position:fixed;right:calc(50% - 240px);bottom:90px;width:50px;height:50px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(46,180,168,.4);cursor:pointer;z-index:99;touch-action:none;user-select:none;}
@media(max-width:520px){.fab{right:16px;}}
.fab svg{width:22px;height:22px;}
.fab-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;font-weight:600;}
.mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.mask.show{display:flex;}
.sheet{background:#fff;width:100%;max-width:500px;max-height:85vh;border-radius:16px 16px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-head{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.sheet-title{font-size:16px;font-weight:600;}
.sheet-close{cursor:pointer;color:var(--text2);font-size:22px;line-height:1;padding:4px;}
.sheet-body{flex:1;overflow-y:auto;padding:16px;}
.sheet-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;}
.sheet-total{font-size:16px;font-weight:700;}
.sheet-total span{color:var(--primary);}
.sheet-btn{background:var(--primary);color:#fff;border:none;padding:11px 28px;border-radius:var(--radius-btn);font-size:14px;cursor:pointer;font-weight:600;}
.sheet-btn:disabled{background:#ddd;cursor:not-allowed;}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.cart-item:last-child{border-bottom:none;}
.cart-img{width:54px;height:54px;border-radius:10px;overflow:hidden;background:#f0f0f0;flex-shrink:0;position:relative;}
.cart-img img{width:100%;height:100%;object-fit:cover;display:block;}
.cart-img .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;text-align:center;padding:2px;position:absolute;top:0;left:0;}
.cart-info{flex:1;min-width:0;}
.cart-name{font-size:14px;font-weight:500;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cart-code{font-size:12px;color:var(--text2);}
.cart-qty{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--text);}
.qty-num{font-size:14px;min-width:20px;text-align:center;font-weight:600;}
.form-group{margin-bottom:16px;}
.form-label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block;}
.form-input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;transition:border-color .2s;background:#fff;}
.form-input:focus{border-color:var(--primary);}
.form-textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;resize:vertical;min-height:70px;font-family:inherit;background:#fff;}
.form-textarea:focus{border-color:var(--primary);}
.page{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:100vh;background:var(--bg);z-index:300;display:none;flex-direction:column;overflow-y:auto;}
.page.show{display:flex;}
.page-head{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.04);flex-shrink:0;}
.page-back{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.page-title-wrap{flex:1;min-width:0;}
.page-title{font-size:18px;font-weight:700;}
.page-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.page-body{flex:1;padding:16px;}
.detail-hero{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;background:#f0f0f0;flex-shrink:0;}
.detail-hero img{width:100%;height:100%;object-fit:cover;display:block;}
.detail-hero .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:700;text-align:center;padding:16px;position:absolute;top:0;left:0;}
.detail-back{position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;backdrop-filter:blur(4px);}
.detail-content{flex:1;padding:16px;}
.detail-code{font-size:13px;color:var(--text2);margin-bottom:6px;}
.detail-name{font-size:22px;font-weight:700;margin-bottom:8px;}
.detail-cat{display:inline-block;padding:3px 12px;border-radius:12px;background:var(--primary-light);color:var(--primary-dark);font-size:12px;margin-bottom:14px;}
.detail-desc{font-size:14px;color:#666;line-height:1.7;margin-bottom:20px;}
.detail-qty{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:20px;}
.detail-qty-label{font-size:14px;color:var(--text);}
.detail-qty-ctrl{display:flex;align-items:center;gap:14px;}
.detail-qty-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;}
.detail-qty-btn.plus{background:var(--primary);color:#fff;border-color:transparent;}
.detail-qty-num{font-size:16px;font-weight:600;min-width:24px;text-align:center;}
.detail-foot{position:sticky;bottom:0;background:#fff;padding:12px 16px;display:flex;gap:12px;box-shadow:0 -2px 10px rgba(0,0,0,.05);flex-shrink:0;}
.detail-btn{flex:1;padding:12px;border-radius:var(--radius-btn);font-size:15px;font-weight:600;cursor:pointer;border:none;}
.detail-btn.outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
.detail-btn.solid{background:var(--primary);color:#fff;}
.order-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.order-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.order-no{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:.3px;}
.order-status{padding:4px 12px;border-radius:12px;font-size:11px;font-weight:600;flex-shrink:0;margin-left:8px;}
.order-status.pending{background:#fff7e6;color:var(--warning);}
.order-status.done{background:#f0f9eb;color:var(--success);}
.order-items{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;}
.order-item-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;}
.order-item-name{color:var(--text);}
.order-item-code{color:var(--text2);font-size:12px;}
.order-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);}
.order-total-label{font-size:13px;color:var(--text2);}
.order-total-val{font-size:18px;font-weight:700;color:var(--primary);}
.order-meta{font-size:12px;color:var(--text3);margin-top:8px;}
.od-section{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.od-section-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text);}
.od-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.od-item:last-child{border-bottom:none;}
.od-item-img{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#f0f0f0;flex-shrink:0;position:relative;}
.od-item-img img{width:100%;height:100%;object-fit:cover;display:block;}
.od-item-img .fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;text-align:center;padding:2px;position:absolute;top:0;left:0;}
.od-item-info{flex:1;min-width:0;}
.od-item-name{font-size:14px;font-weight:500;margin-bottom:3px;}
.od-item-code{font-size:12px;color:var(--text2);}
.od-item-sub{font-size:14px;font-weight:600;color:var(--text);flex-shrink:0;}
.od-info-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;align-items:flex-start;}
.od-info-label{color:var(--text2);flex-shrink:0;display:flex;align-items:center;gap:6px;}
.od-info-value{color:var(--text);font-weight:500;max-width:65%;text-align:right;word-break:break-all;}
.od-total-row{display:flex;justify-content:space-between;padding:12px 0 0;border-top:1px solid var(--border);margin-top:8px;font-size:15px;font-weight:700;}
.od-total-val{color:var(--primary);}
.err-bar{position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px;z-index:9999;display:none;word-break:break-all;}
.err-bar.show{display:block;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;display:none;max-width:80%;text-align:center;}
.toast.show{display:block;}
.report-types{display:flex;flex-wrap:wrap;gap:8px;}
.report-type{padding:8px 16px;border-radius:20px;background:#fff;border:1px solid var(--border);font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s;}
.report-type.active{background:var(--primary);color:#fff;border-color:transparent;}
.banned-page{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;}
.banned-page.show{display:flex;}
.banned-content{max-width:420px;width:100%;text-align:center;color:#fff;}
.banned-icon{font-size:64px;margin-bottom:20px;animation:bannedPulse 2s ease-in-out infinite;}
@keyframes bannedPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.1);opacity:.8;}}
.banned-content h1{font-size:28px;font-weight:700;margin-bottom:12px;color:#ff6b6b;}
.banned-desc{font-size:14px;color:rgba(255,255,255,.7);line-height:1.7;margin-bottom:24px;}
.banned-detail{background:rgba(255,255,255,.08);border-radius:12px;padding:16px;margin-bottom:20px;text-align:left;}
.banned-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.1);}
.banned-row:last-child{border-bottom:none;}
.banned-row span:first-child{color:rgba(255,255,255,.5);}
.banned-row span:last-child{color:#fff;font-weight:500;}
.banned-tip{font-size:12px;color:rgba(255,255,255,.4);}
</style>
</head>
<body>
<div class="err-bar" id="errBar"></div>
<div class="toast" id="toast"></div>
<div class="app" id="app">
  <div class="barrage" id="barrage">
    <span class="barrage-icon">📢</span>
    <div class="barrage-text"><span class="barrage-scroll" id="barrageScroll"></span></div>
    <span class="barrage-close" onclick="closeBarrage()">×</span>
  </div>
  <div class="header">
    <h1>物品展示选择平台</h1>
    <div class="sub">物品展示与信息登记平台</div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索物品关键词" oninput="onSearch(this.value)">
    </div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="goods-grid" id="goodsGrid"></div>
</div>
<div class="tabbar">
  <div class="tab-item active" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>首页</span>
  </div>
  <div class="tab-item" onclick="switchTab('record')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span>我的记录</span>
  </div>
  <div class="tab-item" onclick="switchTab('admin')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>管理入口</span>
  </div>
  <div class="tab-item" onclick="openReport()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    <span>举报</span>
  </div>
</div>
<div class="fab" id="fab" onclick="openCart()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
  <span class="fab-badge" id="fabBadge">0</span>
</div>
<div class="mask" id="cartMask">
  <div class="sheet">
    <div class="sheet-head"><span class="sheet-title">意向清单</span><span class="sheet-close" onclick="closeCart()">×</span></div>
    <div class="sheet-body" id="cartBody"></div>
    <div class="sheet-foot"><div class="sheet-total">合计：<span id="cartTotal">0</span></div><button class="sheet-btn" id="cartSubmit" onclick="openOrderForm()">提交登记</button></div>
  </div>
</div>
<div class="mask" id="formMask">
  <div class="sheet">
    <div class="sheet-head"><span class="sheet-title">填写登记信息</span><span class="sheet-close" onclick="closeOrderForm()">×</span></div>
    <div class="sheet-body">
      <div class="form-group"><label class="form-label">姓名</label><input type="text" class="form-input" id="fName" placeholder="请输入姓名"></div>
      <div class="form-group"><label class="form-label">联系电话</label><input type="tel" class="form-input" id="fPhone" placeholder="请输入联系电话"></div>

// ===== Supabase配置（跨设备同步举报数据）=====
// 使用方法：在 https://supabase.com 注册免费账号，创建项目，把下面两个值替换成你自己的
var SUPABASE_URL='https://sfozgzaopzvxrsxbfyla.supabase.co'; // 例如：https://xxxxxx.supabase.co
var SUPABASE_ANON_KEY='sb_publishable_H9gYwPXXuKQVpH6Q8XCnRw_yZ1dyaPp'; // 你的anon public key
var SUPABASE_ENABLED = SUPABASE_URL && SUPABASE_ANON_KEY;
function supabaseRequest(table, method, body, query){
  if(!SUPABASE_ENABLED) return Promise.reject(new Error('Supabase未配置'));
  var url=SUPABASE_URL+'/rest/v1/'+table;
  if(query) url+='?'+query;
  return new Promise(function(resolve,reject){
    var xhr=new XMLHttpRequest();
    xhr.open(method,url,true);
    xhr.setRequestHeader('apikey',SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Content-Type','application/json');
    xhr.setRequestHeader('Prefer','return=representation');
    xhr.onload=function(){
      if(xhr.status>=200&&xhr.status<300){
        try{resolve(JSON.parse(xhr.responseText));}catch(e){resolve(xhr.responseText);}
      }else{
        reject(new Error('Supabase请求失败:'+xhr.status+' '+xhr.responseText));
      }
    };
    xhr.onerror=function(){reject(new Error('Supabase网络错误'));};
    xhr.send(body?JSON.stringify(body):null);
  });
}

function getDb(){
  try{
    var raw = dbRawCache!==null?dbRawCache:localStorage.getItem('shop_db');
    if(!raw){ var defStr=JSON.stringify(DEFAULT); localStorage.setItem('shop_db', defStr); dbRawCache=defStr; return JSON.parse(JSON.stringify(DEFAULT)); }
    if(dbRawCache===null)dbRawCache=raw;
    var db = JSON.parse(raw); var changed = false;
    if(!Array.isArray(db.goods) || db.goods.length === 0){ db.goods = JSON.parse(JSON.stringify(DEFAULT.goods)); changed = true; }
    if(!Array.isArray(db.categories) || db.categories.length === 0){ db.categories = JSON.parse(JSON.stringify(DEFAULT.categories)); changed = true; }
    if(!Array.isArray(db.bulletins)){ db.bulletins = JSON.parse(JSON.stringify(DEFAULT.bulletins)); changed = true; }
    if(!Array.isArray(db.cart)){ db.cart = []; changed = true; }
    if(!Array.isArray(db.orders)){ db.orders = []; changed = true; }
    if(!Array.isArray(db.adminAccounts) || db.adminAccounts.length === 0){ db.adminAccounts = JSON.parse(JSON.stringify(DEFAULT.adminAccounts)); changed = true; }
    if(!Array.isArray(db.reports)){ db.reports = []; changed = true; }
    if(!Array.isArray(db.bannedDevices)){ db.bannedDevices = []; changed = true; }
    if(changed) localStorage.setItem('shop_db', JSON.stringify(db));
    db.goods.forEach(function(g){if(g.img&&g.img.indexOf('idb://')===0){var key=g.img.substring(6);g.img=imageCache[key]||'';}});
    if(Array.isArray(db.orders)){db.orders.forEach(function(o){if(Array.isArray(o.items)){o.items.forEach(function(it){if(it.img&&it.img.indexOf('idb://')===0){var key=it.img.substring(6);it.img=imageCache[key]||'';}});}});}
    return db;
  }catch(e){ localStorage.setItem('shop_db', JSON.stringify(DEFAULT)); return JSON.parse(JSON.stringify(DEFAULT)); }
}
function saveDb(db){ try{ var dbCopy=JSON.parse(JSON.stringify(db)); dbCopy.goods.forEach(function(g){if(g.img&&g.img.indexOf('data:image')===0){var key='img_'+g.id;idbSave(key,g.img);g.img='idb://'+key;}}); if(Array.isArray(dbCopy.orders)){dbCopy.orders.forEach(function(o){if(Array.isArray(o.items)){o.items.forEach(function(it){if(it.img&&it.img.indexOf('data:image')===0){var key='order_img_'+(it.goodsName||'item');idbSave(key,it.img);it.img='idb://'+key;}});}});} var str=JSON.stringify(dbCopy); localStorage.setItem('shop_db', str); dbRawCache=str; }catch(e){ if(e.name==='QuotaExceededError'||e.code===22){ showToast('存储空间不足，请在管理后台删除部分旧物品或订单后重试'); }else{ showToast('保存失败'); } throw e; } }

function submitOrder(){
  var name=document.getElementById('fName').value.trim(); var phone=document.getElementById('fPhone').value.trim();
  var addr=document.getElementById('fAddr').value.trim(); var note=document.getElementById('fNote').value.trim();
  if(!name){ showToast('请输入姓名'); return; } if(!phone){ showToast('请输入联系电话'); return; }
  var db=getDb(); if(db.cart.length===0){ showToast('清单为空'); return; }
  var total=0; var items=[];
  db.cart.forEach(function(c){ var price=codeToNum(c.code); var sub=price*c.qty; total+=sub; items.push({goodsName:c.name,qty:c.qty,code:c.code,price:price,sub:sub,img:c.img}); });

  var order={orderNo:orderNo,deviceId:deviceId,userName:name,userPhone:phone,userAddr:addr,note:note,items:items,total:total,createTime:timeStr,status:'pending'};
  db.orders.unshift(order); db.cart=[]; saveDb(db); refreshBadge(); closeOrderForm();
  document.getElementById('fName').value=''; document.getElementById('fPhone').value=''; document.getElementById('fAddr').value=''; document.getElementById('fNote').value='';
  showToast('提交成功');
}

}
function openRecord(){ renderRecordList(); document.getElementById('recordPage').classList.add('show'); }
function closeRecord(){ document.getElementById('recordPage').classList.remove('show'); closeOd(); }
function renderRecordList(){
  var db=getDb(); var myOrders=db.orders.filter(function(o){return o.deviceId===deviceId;}); var body=document.getElementById('recordBody');
  if(myOrders.length===0){ body.innerHTML='<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">暂无提交记录</div><div class="empty-link" onclick="switchTab(\'home\')">去首页逛逛</div></div>'; return; }
  var html='';
  myOrders.forEach(function(order){
    var statusText=order.status==='done'?'已处理':'待处理'; var statusClass=order.status==='done'?'done':'pending'; var count=0;
    order.items.forEach(function(it){count+=it.qty;}); var itemsHtml='';
    order.items.forEach(function(it){ itemsHtml+='<div class="order-item-row"><span class="order-item-name">'+it.goodsName+' × '+it.qty+'</span><span class="order-item-code">'+(it.code||'')+'</span></div>'; });
    html+='<div class="order-card" onclick="openOd(\''+order.orderNo+'\')"><div class="order-card-head"><span class="order-no">'+order.orderNo+'</span><span class="order-status '+statusClass+'">'+statusText+'</span></div><div class="order-items">'+itemsHtml+'</div><div class="order-total-row"><span class="order-total-label">合计</span><span class="order-total-val">'+order.total+'</span></div><div class="order-meta">'+order.createTime+' · 共'+count+'件</div></div>';
  });
  body.innerHTML=html;
}
function openOd(orderNo){
  var db=getDb(); var order=db.orders.find(function(o){return o.orderNo===orderNo;}); if(!order)return;
  document.getElementById('odSub').innerText=order.orderNo+' · '+order.createTime; var body=document.getElementById('odBody');
  var statusText=order.status==='done'?'已处理':'待处理'; var statusColor=order.status==='done'?'var(--success)':'var(--warning)';
  var itemsHtml='<div class="od-section"><div class="od-section-title">物品明细</div>';
  order.items.forEach(function(it){
    var g=getGoodsByName(it.goodsName); var grad=g?getGrad(g.catId):'grad-0';
    itemsHtml+='<div class="od-item"><div class="od-item-img '+grad+'">';
    if(it.img){ itemsHtml+='<img src="'+it.img+'" alt="" decoding="async" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'; }
    itemsHtml+='<div class="fallback" style="display:'+(it.img?'none':'flex')+';">'+it.goodsName+'</div></div>';
    itemsHtml+='<div class="od-item-info"><div class="od-item-name">'+it.goodsName+'</div><div class="od-item-code">×'+it.qty+(it.code?' · '+it.code:'')+'</div></div><div class="od-item-sub">'+it.sub+'</div></div>';
  });
  itemsHtml+='<div class="od-total-row"><span>合计</span><span class="od-total-val">'+order.total+'</span></div></div>';
  var infoHtml='<div class="od-section"><div class="od-section-title">联系信息</div><div class="od-info-row"><span class="od-info-label">👤 姓名</span><span class="od-info-value">'+(order.userName||'-')+'</span></div><div class="od-info-row"><span class="od-info-label">📞 电话</span><span class="od-info-value">'+(order.userPhone||'-')+'</span></div><div class="od-info-row"><span class="od-info-label">📍 地址</span><span class="od-info-value">'+(order.userAddr||'-')+'</span></div>'+(order.note?'<div class="od-info-row"><span class="od-info-label">📝 备注</span><span class="od-info-value">'+order.note+'</span></div>':'')+'<div class="od-info-row"><span class="od-info-label">🕐 时间</span><span class="od-info-value">'+order.createTime+'</span></div></div>';
  var statusHtml='<div class="od-section"><div class="od-section-title">订单状态</div><div class="od-info-row"><span class="od-info-label">当前状态</span><span class="od-info-value" style="color:'+statusColor+';font-weight:600;">'+statusText+'</span></div></div>';
  body.innerHTML=itemsHtml+infoHtml+statusHtml; document.getElementById('odPage').classList.add('show');
}
function closeOd(){ document.getElementById('odPage').classList.remove('show'); }
function initFabDrag(){
  var btn=document.getElementById('fab'); if(!btn)return; var dragging=false,moved=false,sx,sy,sl,st;
  function start(e){ var t=e.touches?e.touches[0]:e; sx=t.clientX; sy=t.clientY; var r=btn.getBoundingClientRect(); sl=r.left; st=r.top; dragging=true; moved=false; }
  function move(e){
    if(!dragging)return; var t=e.touches?e.touches[0]:e; var dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>5||Math.abs(dy)>5){ moved=true; if(e.cancelable)e.preventDefault(); }
    var app=document.getElementById('app'); var ar=app.getBoundingClientRect(); var nl=sl+dx,nt=st+dy;
    var maxL=ar.right-btn.offsetWidth-8; var maxT=window.innerHeight-btn.offsetHeight-8;
    nl=Math.max(ar.left+8,Math.min(nl,maxL)); nt=Math.max(8,Math.min(nt,maxT));
    btn.style.left=nl+'px'; btn.style.top=nt+'px'; btn.style.right='auto'; btn.style.bottom='auto';
  }
  function end(){ if(!dragging)return; dragging=false; if(moved){ var r=btn.getBoundingClientRect(); localStorage.setItem('fab_pos',JSON.stringify({left:r.left,top:r.top})); setTimeout(function(){moved=false;},100); } }
  btn.addEventListener('mousedown',start); document.addEventListener('mousemove',move); document.addEventListener('mouseup',end);
  btn.addEventListener('touchstart',start,{passive:false}); document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',end);
  var saved=localStorage.getItem('fab_pos');
  if(saved){ try{ var p=JSON.parse(saved); btn.style.left=p.left+'px'; btn.style.top=p.top+'px'; btn.style.right='auto'; btn.style.bottom='auto'; }catch(e){} }
  btn.addEventListener('click',function(e){ if(moved){ e.stopPropagation(); e.preventDefault(); } },true);
}
var selectedReportType=null;
function openReport(){ document.getElementById('reportMask').classList.add('show'); }
function closeReport(){ document.getElementById('reportMask').classList.remove('show'); selectedReportType=null; var types=document.querySelectorAll('.report-type'); types.forEach(function(t){t.classList.remove('active');}); document.getElementById('reportContent').value=''; }
function selectReportType(el,type){ selectedReportType=type; var types=document.querySelectorAll('.report-type'); types.forEach(function(t){t.classList.remove('active');}); el.classList.add('active'); }
function submitReport(){ if(!selectedReportType){ showToast('请选择举报类型'); return; } var reportType=selectedReportType; var content=document.getElementById('reportContent').value.trim(); var db=getDb(); var now=new Date(); var timeStr=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes(); var reportId='rpt_'+Date.now(); var report={id:reportId,deviceId:deviceId,type:reportType,content:content,time:timeStr,status:'pending'}; db.reports.unshift(report); saveDb(db); closeReport(); showToast('举报已提交，感谢您的反馈'); if(SUPABASE_ENABLED){ var cloudReport={id:reportId,device_id:deviceId,type:reportType,content:content,time:timeStr,status:'pending'}; insertReportToSupabase(cloudReport).catch(function(e){ console.warn('Supabase举报同步失败:',e); }); } }
function checkBanned(){ 
  var db=getDb(); 
  var localBanned=db.bannedDevices.find(function(d){return d.deviceId===deviceId;}); 
  if(SUPABASE_ENABLED){ 
    fetchBannedFromSupabase().then(function(list){ 
      var found=list.find(function(d){return d.device_id===deviceId;}); 
      if(found){ 
        showBannedPage({deviceId:found.device_id,reason:found.reason,time:found.time});
        if(!localBanned){ db.bannedDevices.push({deviceId:found.device_id,reason:found.reason,time:found.time}); saveDb(db); }
      } else { 
        if(localBanned){ db.bannedDevices=db.bannedDevices.filter(function(d){return d.deviceId!==deviceId;}); saveDb(db); }
        var page=document.getElementById('bannedPage'); if(page) page.classList.remove('show');
      } 
    }).catch(function(e){ console.warn('Supabase封禁检查失败:',e); if(localBanned) showBannedPage(localBanned); }); 
  } else { if(localBanned){ showBannedPage(localBanned); return true; } }
  return false; 
}
function showBannedPage(banned){ var page=document.getElementById('bannedPage'); page.classList.add('show'); if(banned&&banned.time){ document.getElementById('bannedTime').innerText=banned.time; } else { var now=new Date(); document.getElementById('bannedTime').innerText=now.getFullYear()+'/'+(now.getMonth()+1)+'/'+now.getDate(); } }
init();
</script>
