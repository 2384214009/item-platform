<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>物品展示选择平台</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        :root{
            --primary:#2eb4a8;
            --primary-dark:#1a8a7f;
            --primary-light:#e8f8f6;
            --bg:#f4f8f8;
            --card:#ffffff;
            --text:#2d3436;
            --text-secondary:#6b7c80;
            --text-muted:#a0b0b3;
            --border:#e4ecec;
            --danger:#e74c3c;
            --warn:#f39c12;
            --radius-sm:8px;
            --radius-md:12px;
            --radius-lg:16px;
            --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
            --shadow-md:0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg:0 8px 24px rgba(0,0,0,0.12);
        }
        html,body{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background:var(--bg);
            color:var(--text);
            -webkit-font-smoothing:antialiased;
            -webkit-tap-highlight-color:transparent;
        }
        body{padding:12px;padding-bottom:80px;max-width:520px;margin:0 auto;min-height:100vh;}

        /* 公告条 */
        .barrage-wrap{
            overflow:hidden;
            background:linear-gradient(135deg,#e8f8f6,#d4f0ed);
            color:#0a6e66;
            padding:10px 36px 10px 14px;
            position:relative;
            border-radius:var(--radius-md);
            margin-bottom:14px;
            border:1px solid #b8e4df;
        }
        .barrage-text{white-space:nowrap;animation:scrollMove 20s linear infinite;font-size:13px;font-weight:500;}
        @keyframes scrollMove{from{transform:translateX(100%);}to{transform:translateX(-100%);}}
        .barrage-close{
            position:absolute;right:8px;top:50%;transform:translateY(-50%);
            border:none;background:rgba(255,255,255,0.6);font-size:14px;cursor:pointer;
            width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
            color:#0a6e66;transition:background 0.2s;
        }
        .barrage-close:hover{background:#fff;}

        /* 头部 */
        header{text-align:center;padding:16px 0 14px;margin-bottom:14px;}
        h1{
            color:var(--primary);font-size:24px;margin-bottom:6px;font-weight:700;
            letter-spacing:1px;
        }
        .desc{font-size:13px;color:var(--text-secondary);}

        /* 搜索框 */
        .search-box{
            width:100%;padding:12px 16px;border:1.5px solid var(--border);
            border-radius:var(--radius-lg);margin-bottom:14px;font-size:14px;
            background:var(--card);transition:border-color 0.2s,box-shadow 0.2s;
            outline:none;
        }
        .search-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,180,168,0.12);}

        /* 分类 */
        .category-scroll{
            display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-bottom:16px;
            scrollbar-width:none;-ms-overflow-style:none;
        }
        .category-scroll::-webkit-scrollbar{display:none;}
        .cat-item{
            white-space:nowrap;padding:8px 18px;background:var(--card);
            border-radius:20px;font-size:14px;flex-shrink:0;cursor:pointer;
            border:1.5px solid var(--border);color:var(--text-secondary);font-weight:500;
            transition:all 0.2s;
        }
        .cat-item:hover{border-color:var(--primary);color:var(--primary);}
        .cat-item.active{
            background:linear-gradient(135deg,var(--primary),var(--primary-dark));
            color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(46,180,168,0.3);
        }

        /* 商品列表 */
        .goods-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        .goods-card{
            background:var(--card);border-radius:var(--radius-md);overflow:hidden;
            box-shadow:var(--shadow-sm);position:relative;transition:transform 0.2s,box-shadow 0.2s;
        }
        .goods-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
        .sellout-tag{
            position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;
            font-size:11px;padding:3px 8px;border-radius:12px;font-weight:600;z-index:2;
            box-shadow:0 2px 6px rgba(231,76,60,0.3);
        }
        .goods-img{width:100%;height:140px;object-fit:cover;display:block;background:#f0f0f0;}
        .goods-img.sellout{opacity:0.4;filter:grayscale(0.6);}
        .goods-info{padding:10px 12px 12px;}
        .goods-name{font-weight:600;font-size:14px;margin-bottom:4px;color:var(--text);line-height:1.3;}
        .goods-price{color:var(--primary);font-weight:bold;font-size:17px;}
        .goods-price::before{content:"¥";font-size:13px;margin-right:1px;}
        .goods-desc{
            font-size:12px;color:var(--text-secondary);margin:5px 0 10px;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
            overflow:hidden;line-height:1.4;min-height:34px;
        }
        .cart-row{display:flex;gap:6px;}
        .cart-add{
            flex:1;padding:9px;border:none;border-radius:var(--radius-sm);
            font-size:13px;background:var(--primary-light);color:var(--primary-dark);
            font-weight:600;cursor:pointer;transition:all 0.2s;
        }
        .cart-add:hover{background:var(--primary);color:#fff;}
        .cart-add:active{transform:scale(0.97);}
        .btn-disabled{
            background:#e8e8e8 !important;color:#aaa !important;cursor:not-allowed !important;
        }
        .btn-disabled:hover{background:#e8e8e8 !important;color:#aaa !important;}

        /* 空状态 */
        .empty-state{
            grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--text-muted);
        }
        .empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:0.5;}
        .empty-state .empty-text{font-size:14px;}

        /* 浮动按钮 */
        .cart-float{
            position:fixed;bottom:84px;right:calc(50% - 260px + 16px);
            width:56px;height:56px;border-radius:50%;
            background:linear-gradient(135deg,var(--primary),var(--primary-dark));
            color:#fff;display:flex;align-items:center;justify-content:center;
            font-size:24px;box-shadow:var(--shadow-lg);
            z-index:50;cursor:grab;transition:transform 0.15s,box-shadow 0.25s;
            border:none;touch-action:none;user-select:none;-webkit-user-select:none;
        }
        .cart-float:hover{transform:scale(1.08);box-shadow:0 12px 28px rgba(46,180,168,0.4);}
        .cart-float:active{cursor:grabbing;}
        .cart-float.dragging{transition:none;transform:scale(1.12);box-shadow:0 12px 32px rgba(46,180,168,0.55);z-index:999;}
        .cart-badge{
            position:absolute;top:-3px;right:-3px;
            background:var(--danger);min-width:20px;height:20px;
            border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;
            font-weight:700;border:2px solid #fff;
        }

        /* 购物车弹窗 */
        .cart-modal{
            position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;z-index:99;
            backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
        }
        .cart-modal.show{display:block;animation:fadeIn 0.2s ease;}
        .cart-panel{
            position:absolute;bottom:0;left:50%;transform:translateX(-50%);
            background:var(--card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;
            max-height:75vh;display:flex;flex-direction:column;width:100%;max-width:520px;
            animation:slideUp 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        @keyframes slideUp{from{transform:translateX(-50%) translateY(100%);}to{transform:translateX(-50%) translateY(0);}}
        .cart-head{
            padding:16px 18px;border-bottom:1px solid var(--border);
            display:flex;justify-content:space-between;align-items:center;
        }
        .cart-head h3{font-size:17px;font-weight:700;}
        .cart-head button{
            border:none;background:var(--bg);color:var(--text-secondary);
            padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;
            transition:background 0.2s;
        }
        .cart-head button:hover{background:var(--border);}
        .cart-body{flex:1;overflow-y:auto;padding:8px 18px;}
        .cart-foot{padding:14px 18px;border-top:1px solid var(--border);background:#fafcfc;}
        .cart-foot > div{font-size:15px;margin-bottom:10px;color:var(--text-secondary);}
        .cart-foot > div b{color:var(--primary);font-size:20px;font-weight:700;}
        .cart-item{
            display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f3f6f6;align-items:center;
        }
        .cart-item:last-child{border-bottom:none;}
        .cart-item img{width:56px;height:56px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;}
        .cart-item > div:nth-child(2){flex:1;min-width:0;}
        .cart-item > div:nth-child(2) > div:first-child{font-weight:600;font-size:14px;margin-bottom:2px;}
        .cart-item > div:nth-child(2) > div:nth-child(2){color:var(--primary);font-weight:600;font-size:14px;margin-bottom:6px;}
        .cart-qty{display:flex;gap:6px;align-items:center;}
        .cart-qty button{
            width:26px;height:26px;border-radius:6px;border:1px solid var(--border);
            background:#f7f9f9;font-size:14px;cursor:pointer;display:flex;align-items:center;
            justify-content:center;transition:all 0.15s;color:var(--text);
        }
        .cart-qty button:hover:not(:disabled){border-color:var(--primary);color:var(--primary);}
        .cart-qty button:disabled{opacity:0.4;cursor:not-allowed;}
        .cart-qty span{min-width:24px;text-align:center;font-weight:600;font-size:14px;}
        .cart-qty .remove-btn{
            width:auto;padding:0 10px;font-size:12px;color:var(--danger);
            border-color:#f5d5d2;background:#fdf5f4;margin-left:4px;
        }
        .cart-qty .remove-btn:hover{border-color:var(--danger);color:var(--danger);}
        .cart-item > div:last-child{font-weight:700;font-size:14px;color:var(--text);flex-shrink:0;}

        .submit-order{
            width:100%;padding:13px;border:none;border-radius:var(--radius-md);
            background:linear-gradient(135deg,var(--primary),var(--primary-dark));
            color:#fff;font-size:15px;font-weight:600;cursor:pointer;
            transition:transform 0.15s,box-shadow 0.2s;
            box-shadow:0 4px 12px rgba(46,180,168,0.3);
        }
        .submit-order:hover{box-shadow:0 6px 18px rgba(46,180,168,0.4);}
        .submit-order:active{transform:scale(0.98);}

        /* 订单弹窗 */
        .order-modal{
            position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;
            align-items:center;justify-content:center;padding:14px;z-index:100;
            backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
        }
        .order-modal.show{display:flex;animation:fadeIn 0.2s ease;}
        .modal-box{
            background:var(--card);width:100%;max-width:420px;border-radius:var(--radius-lg);
            padding:22px;max-height:85vh;overflow-y:auto;
            animation:popIn 0.3s cubic-bezier(0.16,1,0.3,1);
            box-shadow:var(--shadow-lg);
        }
        @keyframes popIn{from{opacity:0;transform:scale(0.92);}to{opacity:1;transform:scale(1);}}
        .modal-box h3{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center;}
        .modal-box #orderListShow{
            background:var(--bg);border-radius:var(--radius-sm);padding:12px;
            margin-bottom:14px;font-size:13px;line-height:1.8;
        }
        .modal-box #orderListShow > div{display:flex;justify-content:space-between;}
        .modal-box > div:nth-of-type(2){
            font-size:15px;margin-bottom:14px;padding-top:10px;
            border-top:1px dashed var(--border);display:flex;justify-content:space-between;
            align-items:center;
        }
        .modal-box > div:nth-of-type(2) b{color:var(--primary);font-size:18px;font-weight:700;}
        input,textarea{
            width:100%;padding:12px 14px;margin:6px 0;border:1.5px solid var(--border);
            border-radius:var(--radius-sm);font-size:14px;background:var(--card);
            transition:border-color 0.2s,box-shadow 0.2s;outline:none;font-family:inherit;
        }
        input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,180,168,0.12);}
        textarea{resize:vertical;min-height:60px;}

        /* 底部导航 */
        .nav-bottom{
            position:fixed;bottom:0;left:50%;transform:translateX(-50%);
            background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
            display:flex;border-top:1px solid var(--border);z-index:10;
            width:100%;max-width:520px;box-shadow:0 -2px 12px rgba(0,0,0,0.05);
        }
        .nav-bottom button{
            flex:1;padding:10px 0 8px;border:none;background:transparent;
            font-size:12px;color:var(--text-muted);cursor:pointer;
            display:flex;flex-direction:column;align-items:center;gap:3px;
            transition:color 0.2s;font-family:inherit;
        }
        .nav-bottom button .nav-icon{font-size:20px;line-height:1;}
        .nav-bottom button:hover{color:var(--primary);}
        .nav-bottom button.active{color:var(--primary);font-weight:600;}
    </style>
</head>
<body>
<div id="barrageWrap" class="barrage-wrap" style="display:none;">
    <div id="barrageText" class="barrage-text"></div>
    <button class="barrage-close" onclick="closeBarrage()">×</button>
</div>
<header>
    <h1>物品展示选择平台</h1>
    <div class="desc">浏览物品，添加意向清单</div>
</header>
<input class="search-box" placeholder="搜索物品关键词" id="searchInput" oninput="doSearch()">
<div class="category-scroll" id="catScroll"></div>
<div class="goods-list" id="goodsList"></div>
<div class="cart-float" id="cartFloatBtn">
    📋
    <span class="cart-badge" id="cartBadge">0</span>
</div>
<div class="cart-modal" id="cartModal">
    <div class="cart-panel">
        <div class="cart-head">
            <h3>意向清单</h3>
            <button onclick="closeCartModal()">关闭</button>
        </div>
        <div class="cart-body" id="cartBody"></div>
        <div class="cart-foot">
            <div>合计：<b id="cartTotal">¥0.00</b></div>
            <button class="submit-order" onclick="goCheckout()">提交意向</button>
        </div>
    </div>
</div>
<div class="order-modal" id="orderModal">
    <div class="modal-box">
        <h3>填写联系信息</h3>
        <div id="orderListShow"></div>
        <input placeholder="姓名" id="userName" autocapitalize="off" autocomplete="off">
        <input placeholder="联系电话" id="userPhone" type="tel" autocapitalize="off" autocomplete="off">
        <input placeholder="联系地址" id="userAddr" autocapitalize="off" autocomplete="off">
        <textarea placeholder="备注信息（选填）" id="userNote" rows="2"></textarea>
        <div>总金额：<b id="orderTotalShow">¥0.00</b></div>
        <button class="submit-order" onclick="submitAllOrder()">确认提交</button>
    </div>
</div>
<div class="nav-bottom">
    <button class="active" onclick="location.href='index.html'"><span class="nav-icon">🏠</span>首页</button>
    <button onclick="openMyOrder()"><span class="nav-icon">📋</span>我的记录</button>
    <button onclick="location.href='admin.html'"><span class="nav-icon">⚙️</span>管理入口</button>
</div>
<script>
let deviceId = localStorage.getItem("device_uid");
if(!deviceId){
    deviceId = "dev_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    localStorage.setItem("device_uid",deviceId);
}
function getDb(){
    const raw = localStorage.getItem("shop_db");
    return raw ? JSON.parse(raw) : {
        goods:[
            {id:1,catId:"aixi",name:"爱喜 酸奶",price:18,desc:"经典酸奶口味，清爽顺滑",img:"https://images.unsplash.com/photo-1488477181946-6428a0291777?w=400",sellout:false},
            {id:2,catId:"aixi",name:"爱喜 香芋",price:18,desc:"浓郁香芋风味，绵密细腻",img:"https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=400",sellout:false},
            {id:3,catId:"aixi",name:"爱喜 茉莉",price:20,desc:"清新茉莉花香，回味悠长",img:"https://images.unsplash.com/photo-1564890369478-c89ca6d9cde9?w=400",sellout:false},
            {id:4,catId:"alishan",name:"阿里山 天韵",price:25,desc:"阿里山经典系列，口感醇厚",img:"https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400",sellout:false},
            {id:5,catId:"alishan",name:"阿里山 芒果",price:22,desc:"热带芒果风味，果香四溢",img:"https://images.unsplash.com/photo-1553279768-86542fa0078?w=400",sellout:false},
            {id:6,catId:"baile",name:"百乐 原味",price:15,desc:"百乐经典原味，简约之选",img:"https://images.unsplash.com/photo-1578913130218-2f66c2b3a1a0?w=400",sellout:false},
        ],
        orders:[],
        categories:[
            {id:"aixi",name:"爱喜"},
            {id:"alishan",name:"阿里山"},
            {id:"baile",name:"百乐"},
        ],
        adminAccounts:[{username:"2384214009",pwd:"13727733582q.",role:"super"},{username:"admin",pwd:"admin123",role:"normal"}],
        cart:[],
        bulletins:[{id:1,content:"欢迎使用物品展示平台 | 本平台仅用于信息登记，不提供任何交易服务",enable:true}],
    };
}
function saveDb(db){localStorage.setItem("shop_db",JSON.stringify(db));}

function renderBulletin(){
    const db = getDb();
    const wrap = document.getElementById("barrageWrap");
    const txtDom = document.getElementById("barrageText");
    const showClosed = sessionStorage.getItem("barrage_closed");
    const activeList = db.bulletins.filter(b=>b.enable===true);
    if(activeList.length===0 || showClosed==="1"){wrap.style.display="none";return;}
    wrap.style.display="block";
    txtDom.innerText = activeList.map(i=>i.content).join("　｜　");
}
function closeBarrage(){
    sessionStorage.setItem("barrage_closed","1");
    document.getElementById("barrageWrap").style.display="none";
}

let currentCat = "all";
let searchKey = "";
function renderCats(){
    const db = getDb();
    const wrap = document.getElementById("catScroll");
    wrap.innerHTML = `<div class="cat-item ${currentCat==='all'?'active':''}" onclick="switchCat('all')">全部</div>`;
    db.categories.forEach(c=>{
        wrap.innerHTML += `<div class="cat-item ${currentCat===c.id?'active':''}" onclick="switchCat('${c.id}')">${c.name}</div>`;
    });
}
function switchCat(cid){currentCat=cid;renderCats();renderGoods();}
function doSearch(){searchKey=document.getElementById("searchInput").value.trim().toLowerCase();renderGoods();}

function renderGoods(){
    const db = getDb();
    const wrap = document.getElementById("goodsList");
    wrap.innerHTML = "";
    let list = db.goods;
    if(currentCat!=='all') list = db.goods.filter(g=>g.catId===currentCat);
    if(searchKey) list = list.filter(g=>g.name.toLowerCase().includes(searchKey));
    if(list.length===0){
        wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">暂无相关物品</div></div>`;
        refreshCartBadge();
        return;
    }
    list.forEach(item=>{
        const isSellout = item.sellout===true;
        const card = document.createElement("div");
        card.className="goods-card";
        card.innerHTML=`
            ${isSellout?'<span class="sellout-tag">已无库存</span>':''}
            <img class="goods-img ${isSellout?'sellout':''}" src="${item.img}" alt="${item.name}" loading="lazy">
            <div class="goods-info">
                <div class="goods-name">${item.name}</div>
                <div class="goods-price">${item.price}</div>
                <div class="goods-desc">${item.desc}</div>
                <div class="cart-row">
                    <button class="cart-add ${isSellout?'btn-disabled':''}" onclick="addToCart(${item.id})" ${isSellout?'disabled':''}>加入清单</button>
                </div>
            </div>
        `;
        wrap.appendChild(card);
    });
    refreshCartBadge();
}

function getCart(){const raw=localStorage.getItem("shop_cart");return raw?JSON.parse(raw):[];}
function saveCart(arr){localStorage.setItem("shop_cart",JSON.stringify(arr));}
function addToCart(goodsId){
    const db=getDb();const goods=db.goods.find(g=>g.id===goodsId);
    if(goods.sellout) return alert("该物品已无库存");
    let cart=getCart();const idx=cart.findIndex(x=>x.gid===goodsId);
    if(idx>=0){cart[idx].qty+=1;}else{cart.push({gid:goodsId,qty:1});}
    saveCart(cart);refreshCartBadge();
}
function refreshCartBadge(){
    const cart=getCart();const total=cart.reduce((s,i)=>s+i.qty,0);
    document.getElementById("cartBadge").innerText=total;
}

function openCartModal(){
    const modal=document.getElementById("cartModal");
    modal.classList.add("show");modal.style.display="block";
    renderCartPanel();
}
function closeCartModal(){
    const modal=document.getElementById("cartModal");
    modal.classList.remove("show");
    setTimeout(()=>{modal.style.display="none";},200);
}
function renderCartPanel(){
    const db=getDb();const cart=getCart();
    const body=document.getElementById("cartBody");
    body.innerHTML="";
    if(cart.length===0){
        body.innerHTML=`<div class="empty-state"><div class="empty-icon">🛒</div><div class="empty-text">清单还是空的，快去添加物品吧</div></div>`;
        document.getElementById("cartTotal").innerText="¥0.00";
        return;
    }
    let total=0;
    cart.forEach(item=>{
        const g=db.goods.find(x=>x.id===item.gid);
        if(!g) return;
        const sellFlag=!!g.sellout;
        const subtotal=Number(g.price)*item.qty;
        total+=subtotal;
        body.innerHTML+=`
        <div class="cart-item">
            <img src="${g.img}" alt="${g.name}">
            <div style="flex:1;min-width:0">
                <div>${g.name} ${sellFlag?"【无库存】":""}</div>
                <div>¥${g.price}</div>
                <div class="cart-qty">
                    <button onclick="cartMinus(${item.gid})">-</button>
                    <span>${item.qty}</span>
                    <button onclick="cartPlus(${item.gid})" ${sellFlag?'disabled':''}>+</button>
                    <button class="remove-btn" onclick="cartDel(${item.gid})">移除</button>
                </div>
            </div>
            <div>¥${subtotal.toFixed(2)}</div>
        </div>
        `;
    });
    document.getElementById("cartTotal").innerText="¥"+total.toFixed(2);
}
function cartMinus(gid){
    let cart=getCart();const idx=cart.findIndex(i=>i.gid===gid);
    if(idx===-1) return;
    cart[idx].qty-=1;
    if(cart[idx].qty<=0) cart.splice(idx,1);
    saveCart(cart);renderCartPanel();refreshCartBadge();
}
function cartPlus(gid){
    let cart=getCart();const idx=cart.findIndex(i=>i.gid===gid);
    if(idx!==-1) cart[idx].qty+=1;
    saveCart(cart);renderCartPanel();refreshCartBadge();
}
function cartDel(gid){
    let cart=getCart();cart=cart.filter(i=>i.gid!==gid);
    saveCart(cart);renderCartPanel();refreshCartBadge();
}

function goCheckout(){
    const db=getDb();const cart=getCart();
    if(cart.length===0){alert("清单为空");return;}
    const hasSellout=cart.some(c=>{const g=db.goods.find(x=>x.id===c.gid);return g?.sellout;});
    if(hasSellout){alert("清单内存在无库存物品，请先移除");return;}
    closeCartModal();
    setTimeout(()=>{
        const modal=document.getElementById("orderModal");
        modal.classList.add("show");modal.style.display="flex";
        let html="";let sum=0;
        cart.forEach(c=>{
            const g=db.goods.find(x=>x.id===c.gid);
            sum+=Number(g.price)*c.qty;
            html+=`<div><span>${g.name} ×${c.qty}</span><span>¥${Number(g.price)*c.qty}</span></div>`;
        });
        document.getElementById("orderListShow").innerHTML=html;
        document.getElementById("orderTotalShow").innerText="¥"+sum.toFixed(2);
    },200);
}
function submitAllOrder(){
    const name=document.getElementById("userName").value.trim();
    const phone=document.getElementById("userPhone").value.trim();
    const addr=document.getElementById("userAddr").value.trim();
    const note=document.getElementById("userNote").value.trim();
    if(!name||!phone||!addr){alert("姓名、电话、地址为必填项");return;}
    const db=getDb();const cart=getCart();
    let sum=0;const itemList=[];
    cart.forEach(c=>{
        const g=db.goods.find(x=>x.id===c.gid);
        sum+=Number(g.price)*c.qty;
        itemList.push({goodsId:g.id,goodsName:g.name,price:g.price,qty:c.qty,sub:Number(g.price)*c.qty});
    });
    const newOrder={
        orderNo:"REC"+Date.now(),deviceId:deviceId,items:itemList,
        userName:name,userPhone:phone,userAddr:addr,note:note,
        total:sum.toFixed(2),status:"pending",createTime:new Date().toLocaleString()
    };
    db.orders.push(newOrder);saveDb(db);saveCart([]);refreshCartBadge();
    alert(`提交完成，记录编号：${newOrder.orderNo}`);
    const modal=document.getElementById("orderModal");
    modal.classList.remove("show");
    setTimeout(()=>{modal.style.display="none";},200);
    document.getElementById("userName").value="";
    document.getElementById("userPhone").value="";
    document.getElementById("userAddr").value="";
    document.getElementById("userNote").value="";
}
function openMyOrder(){
    const db=getDb();const my=db.orders.filter(o=>o.deviceId===deviceId);
    let str="==== 我的提交记录 ====\n";
    if(my.length===0){alert("暂无提交记录");return;}
    my.forEach(o=>{
        str+=`\n记录编号：${o.orderNo} ${o.status==='pending'?'【待处理】':'【已处理】'}\n`;
        o.items.forEach(it=>str+=`${it.goodsName} ×${it.qty} ¥${it.sub}\n`);
        str+=`合计：${o.total} 时间：${o.createTime}\n`;
    });
    alert(str);
}

// ===== 浮动按钮拖拽功能 =====
(function(){
    const btn = document.getElementById("cartFloatBtn");
    const BTN_SIZE = 56;
    let isDragging = false, hasMoved = false;
    let startX = 0, startY = 0, offsetX = 0, offsetY = 0;

    const savedPos = localStorage.getItem("cart_float_pos_cn");
    if(savedPos){
        try{
            const pos = JSON.parse(savedPos);
            btn.style.left = pos.x + "px";
            btn.style.top = pos.y + "px";
            btn.style.right = "auto";
            btn.style.bottom = "auto";
        }catch(e){}
    }

    function getPoint(e){return e.touches ? e.touches[0] : e;}
    function onStart(e){
        const p = getPoint(e);
        const rect = btn.getBoundingClientRect();
        startX = p.clientX; startY = p.clientY;
        offsetX = p.clientX - rect.left;
        offsetY = p.clientY - rect.top;
        isDragging = true; hasMoved = false;
        btn.classList.add("dragging");
        e.preventDefault();
    }
    function onMove(e){
        if(!isDragging) return;
        const p = getPoint(e);
        const dx = p.clientX - startX, dy = p.clientY - startY;
        if(Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;
        if(hasMoved){
            let x = p.clientX - offsetX, y = p.clientY - offsetY;
            x = Math.max(4, Math.min(window.innerWidth - BTN_SIZE - 4, x));
            y = Math.max(4, Math.min(window.innerHeight - BTN_SIZE - 4, y));
            btn.style.left = x + "px";
            btn.style.top = y + "px";
            btn.style.right = "auto";
            btn.style.bottom = "auto";
            e.preventDefault();
        }
    }
    function onEnd(){
        if(!isDragging) return;
        isDragging = false;
        btn.classList.remove("dragging");
        if(hasMoved){
            const rect = btn.getBoundingClientRect();
            localStorage.setItem("cart_float_pos_cn", JSON.stringify({x:rect.left, y:rect.top}));
        }else{
            openCartModal();
        }
    }

    btn.addEventListener("mousedown", onStart);
    btn.addEventListener("touchstart", onStart, {passive:false});
    document.addEventListener("mousemove", onMove);
    document.addEventListener("touchmove", onMove, {passive:false});
    document.addEventListener("mouseup", onEnd);
    document.addEventListener("touchend", onEnd);

    window.addEventListener("resize", function(){
        const rect = btn.getBoundingClientRect();
        let x = rect.left, y = rect.top;
        x = Math.max(4, Math.min(window.innerWidth - BTN_SIZE - 4, x));
        y = Math.max(4, Math.min(window.innerHeight - BTN_SIZE - 4, y));
        btn.style.left = x + "px";
        btn.style.top = y + "px";
    });
})();

renderCats();
renderGoods();
renderBulletin();
</script>
